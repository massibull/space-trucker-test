<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Trucker - Prototipo docking v0.3.2</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  SPACE TRUCKER - prototipo docking 2D
  Obiettivo del prototipo: capire se la manovra con inerzia e' piacevole.
  Un solo file, nessuna dipendenza. Tutti i numeri da regolare sono in P (sotto).
*/

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, PANEL = 280;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  PANEL = clamp(Math.round(W * 0.3), 230, 300);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// Parametri di gioco (unita': metri, secondi, radianti)
// ---------------------------------------------------------------------------
const P = {
  shipR: 3.5, noseLen: 4,
  main: 2.0, reverse: 1.0, lateral: 0.7,       // accelerazioni (m/s^2)
  torque: 0.9, wMax: 1.2, assistTorque: 0.7,   // rotazione (rad/s^2, rad/s)
  fine: 0.3,                                   // fattore con SHIFT (controllo fine)
  fuel: 60, useMain: 0.5, useRev: 0.3, useLat: 0.25, useRot: 0.12,
  hubR: 16, boomR: 44,                         // geometria stazione
  maxClose: 1.2, maxLat: 0.8, maxAng: 12, maxRot: 0.12,  // tolleranze di aggancio
  startMin: 220, startVar: 60,
  // punteggio (da tarare con i dati dei test)
  scoreBase: 400, speedMax: 600, speedRate: 6,   // rapidita': 600 - 6 punti per ogni secondo, mai sotto zero
  fuelRate: 3, perfectBonus: 300, dmgRate: 8,    // 3 pt/unita' di propellente, +300 se perfetto, -8 pt per ogni 1% di integrita' persa
  // indice di ingaggio (0-100): media di 3 componenti, ciascuna con il suo tetto
  engPpm: 30, engIdle: 40, engActive: 0.4,       // 30 pressioni/min = 100; 40 s senza input = 0; 40% del tempo con un tasto premuto = 100
  perfectFrac: 0.5,                              // "perfetto" = tutti e 4 i parametri entro il 50% del limite
};
const VERSION = '0.3.2';                         // da aggiornare a ogni build condivisa
const SPINS = [0, 0.02, 0.04, 0.06];           // rad/s della stazione
const SPIN_NAMES = ['ferma', 'piano', 'medio', 'veloce'];
const opts = { assist: true, lateral: true, spin: 0 };
const AIDS_NAMES = ['completo', 'essenziale', 'nullo'];
let aids = 0;                                  // livello degli aiuti visivi (P in gioco, [4] nel menu)

// ---------------------------------------------------------------------------
// Raccolta dati anonimi dei test (nessun IP, nessun cookie: solo un codice casuale per sessione)
// Per attivarla incolla qui l'indirizzo dell'app web Google (finisce con /exec). Vuoto = disattivata.
// ---------------------------------------------------------------------------
const LOG_URL = 'https://script.google.com/macros/s/AKfycbwsUqKaMB5q3vQoT0KtUqIEEuVpVHRJU5uMuFaZ7jUvCkmjrpnMcBj86JWXHZkLhUxq/exec';
// In locale (file aperto con doppio click o localhost) i dati NON si inviano, per non sporcare i test veri.
// Per forzare l'invio anche in locale: aggiungi ?log=1 all'indirizzo.
const LOCALE = location.protocol === 'file:' || ['localhost', '127.0.0.1', '::1', '[::1]'].includes(location.hostname);
const LOG_ON = !!LOG_URL && (!LOCALE || new URLSearchParams(location.search).get('log') === '1');
const SESSION = Math.random().toString(36).slice(2, 10);
let attempt = 0;

function logEvent(type, data) {
  if (!LOG_ON) return;
  try {
    fetch(LOG_URL, {
      method: 'POST', mode: 'no-cors', keepalive: true,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },     // evita il controllo CORS preliminare
      body: JSON.stringify(Object.assign({ type, session: SESSION, version: 'v' + VERSION }, data)),   // 'v' evita che il foglio legga 0.2.2 come un orario
    }).catch(() => {});
  } catch (e) { /* la registrazione non deve mai disturbare il gioco */ }
}

function browserName() {
  const u = navigator.userAgent;
  if (/Edg\//.test(u)) return 'Edge';
  if (/OPR\//.test(u)) return 'Opera';
  if (/Firefox\//.test(u)) return 'Firefox';
  if (/Chrome\//.test(u)) return 'Chrome';
  if (/Safari\//.test(u)) return 'Safari';
  return 'altro';
}

// Indice di ingaggio 0-100: quanto il giocatore interagisce, in tre componenti uguali.
//  frequenza = pressioni al minuto; presenza = quanto a lungo non ha mai mollato (pausa piu' lunga);
//  attivita' = quota del tempo con almeno un tasto premuto. Fermarsi a osservare e' normale (la nave
//  prosegue per inerzia), per questo i tetti sono bassi: l'indice serve a confrontare, non a giudicare.
function engagementIndex() {
  const t = Math.max(S.t, 0.1);
  const freq = Math.min(1, (S.presses / (t / 60)) / P.engPpm);
  const pres = 1 - Math.min(1, Math.max(S.maxIdle, S.idle) / P.engIdle);
  const att = Math.min(1, (S.active / t) / P.engActive);
  return Math.round(100 * (freq + pres + att) / 3);
}

// Punteggio massimo di tutti i test (senza nomi): si legge dal foglio all'apertura della pagina.
// Se la lettura fallisce (offline, ecc.) il gioco funziona uguale e semplicemente non mostra la riga.
let recordGlobale = null;
function caricaRecord() {
  if (!LOG_URL) return;
  fetch(LOG_URL + '?azione=max').then(r => r.json())
    .then(d => { if (typeof d.max === 'number') recordGlobale = Math.max(recordGlobale || 0, d.max); })
    .catch(() => {});
}

const ESITI = { docked: 'agganciato', destroyed: 'distrutto', drift: 'alla deriva', abandoned: 'abbandonato' };
const sino = v => (v ? 'si' : 'no');
let logNote = { text: '', t: 0 };                    // conferma "dati inviati" mostrata a schermo

function logRun(result) {
  if (S.logged || S.t < 2) return;                 // niente righe per prove di pochi secondi
  S.logged = true;
  const esito = ESITI[result] || result;
  logEvent('run', {
    attempt: ++attempt, result: esito, perfect: sino(S.result && S.result.perfect),
    time: Math.round(S.t * 10) / 10, fuel: Math.round(S.fuel), hull: Math.max(0, Math.round(S.hull)),
    dmg: Math.round(S.dmg), bounces: S.bounces, hits: S.hits,
    score: S.result ? S.result.score : 0,
    assist: sino(opts.assist), lateral: sino(opts.lateral), spin: SPIN_NAMES[opts.spin],
    presses: S.presses, active: Math.round(100 * S.active / Math.max(S.t, 0.1)),
    idleMax: Math.round(Math.max(S.maxIdle, S.idle) * 10) / 10,
    firstInput: Math.round((S.firstInput === null ? S.t : S.firstInput) * 10) / 10,
    failClose: S.failClose, failLat: S.failLat, failAng: S.failAng, failRot: S.failRot,
    engagement: engagementIndex(),
    aids: AIDS_NAMES[S.aidTime.indexOf(Math.max(...S.aidTime))],      // livello usato per piu' tempo
    aidChanges: S.aidSwitches,
    // valori dei 4 parametri nell'ultimo contatto col portellone (vuoti se non c'e' stato contatto)
    cVel: S.contact ? Math.round(S.contact.v[0] * 100) / 100 : '', cLat: S.contact ? Math.round(S.contact.v[1] * 100) / 100 : '',
    cAng: S.contact ? Math.round(S.contact.v[2] * 10) / 10 : '', cRot: S.contact ? Math.round(S.contact.v[3] * 1000) / 1000 : '',
  });
  if (LOG_ON) logNote = { text: `dati inviati: tentativo ${attempt} (${esito})`, t: 6 };
}

// ---------------------------------------------------------------------------
// Utilita'
// ---------------------------------------------------------------------------
function angDiff(a, b) {
  let d = (a - b) % (2 * Math.PI);
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  return d;
}
const COL = { bg: '#05070d', st: '#6f8fb0', port: '#ffb347', ship: '#7fe7ff',
              good: '#6bff9a', warn: '#ffd75e', bad: '#ff6b6b', dim: '#6c7a89', txt: '#d6e2ee' };

// ---------------------------------------------------------------------------
// Stato
// ---------------------------------------------------------------------------
let S, mode = 'menu', banner = null;
let helpPage = 0, helpFrom = 'menu', doneDetails = false;
const cam = { x: 0, y: 0, s: 1 };

function newRun() {
  const ang = Math.random() * Math.PI * 2;
  const dist = P.startMin + Math.random() * P.startVar;
  S = {
    clock: 0, t: 0,                            // clock: fase stazione; t: tempo di missione
    psi0: Math.random() * Math.PI * 2, ws: SPINS[opts.spin],
    x: Math.cos(ang) * dist, y: Math.sin(ang) * dist,
    vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5,
    th: Math.random() * Math.PI * 2, w: (Math.random() - 0.5) * 0.2,
    fuel: P.fuel, hull: 100, dmg: 0, prevA: 1, flash: 0, bounces: 0, hits: 0, logged: false,
    presses: 0, active: 0, idle: 0, maxIdle: 0, firstInput: null,
    contact: null, dock: null,
    failClose: 0, failLat: 0, failAng: 0, failRot: 0, aidTime: [0, 0, 0], aidSwitches: 0,
    fl: { main: 0, rev: 0, latL: 0, latR: 0, rotL: 0, rotR: 0 },
    result: null,
  };
  banner = null;
  updateCam(0, true);
}

// ---------------------------------------------------------------------------
// Stazione: geometria e porto di attracco (ruotano con la stazione)
// ---------------------------------------------------------------------------
function portAt(tc) {
  const psi = S.psi0 + S.ws * tc;
  const nx = Math.cos(psi), ny = Math.sin(psi);
  const px = nx * P.boomR, py = ny * P.boomR;
  return { psi, nx, ny, tx: -ny, ty: nx, px, py, vx: -S.ws * py, vy: S.ws * px };
}

function solids() {
  const p = portAt(S.clock);
  const q = S.psi0 + Math.PI + S.ws * S.clock;
  const ex = Math.cos(q) * 34, ey = Math.sin(q) * 34;
  const cx = p.px - p.nx, cy = p.py - p.ny;     // piastra di attracco (spessore 2 m)
  return [
    { type: 'c', x: 0, y: 0, r: P.hubR },
    { type: 's', ax: 0, ay: 0, bx: p.px - 2 * p.nx, by: p.py - 2 * p.ny, r: 1.5 },
    { type: 's', ax: cx + p.tx * 3, ay: cy + p.ty * 3, bx: cx + p.tx * 12, by: cy + p.ty * 12, r: 1 },
    { type: 's', ax: cx - p.tx * 3, ay: cy - p.ty * 3, bx: cx - p.tx * 12, by: cy - p.ty * 12, r: 1 },
    { type: 's', ax: 0, ay: 0, bx: ex, by: ey, r: 1.5 },
    { type: 'c', x: ex, y: ey, r: 6 },
  ];
}

function closestOnSeg(o, x, y) {
  const dx = o.bx - o.ax, dy = o.by - o.ay;
  const t = clamp(((x - o.ax) * dx + (y - o.ay) * dy) / (dx * dx + dy * dy), 0, 1);
  return [o.ax + dx * t, o.ay + dy * t];
}

// ---------------------------------------------------------------------------
// Telemetria: tutto cio' che serve al pannello e alla valutazione dell'aggancio
// ---------------------------------------------------------------------------
function telemetry() {
  const p = portAt(S.clock);
  const hx = Math.cos(S.th), hy = Math.sin(S.th);
  const nx = S.x + hx * P.noseLen, ny = S.y + hy * P.noseLen;
  const dx = nx - p.px, dy = ny - p.py;
  const rvx = S.vx - p.vx, rvy = S.vy - p.vy;
  const closing = -(rvx * p.nx + rvy * p.ny);
  return {
    p, a: dx * p.nx + dy * p.ny, l: dx * p.tx + dy * p.ty,
    dist: Math.hypot(dx, dy), closing,
    lat: Math.abs(rvx * p.tx + rvy * p.ty),
    err: angDiff(S.th, p.psi + Math.PI) * 180 / Math.PI,
    rot: S.w - S.ws,
  };
}

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (mode === 'run' && !e.repeat && CONTROLS.includes(e.code)) S.presses++;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (mode === 'menu') {
    if (e.code === 'Digit1') { opts.assist = !opts.assist; newRun(); }
    if (e.code === 'Digit2') { opts.lateral = !opts.lateral; newRun(); }
    if (e.code === 'Digit3') { opts.spin = (opts.spin + 1) % SPINS.length; newRun(); }
    if (e.code === 'Digit4') aids = (aids + 1) % AIDS_NAMES.length;
    if (e.code === 'KeyH') openHelp();
    if (e.code === 'Enter' || e.code === 'Space') mode = 'run';
  } else if (mode === 'run') {
    if (e.code === 'Enter') { logRun('abandoned'); newRun(); }      // ricomincia il tentativo
    if (e.code === 'KeyM' || e.code === 'Escape') { logRun('abandoned'); mode = 'menu'; newRun(); }
    if (e.code === 'KeyP' && !e.repeat) {
      aids = (aids + 1) % AIDS_NAMES.length; S.aidSwitches++;
      banner = { text: 'aiuti visivi: ' + AIDS_NAMES[aids], t: 2, col: COL.ship };
    }
    if (e.code === 'KeyH') openHelp();                 // la guida mette in pausa la partita
  } else if (mode === 'done') {
    if (e.code === 'Enter') { newRun(); mode = 'run'; }
    if (e.code === 'Space') doneDetails = !doneDetails;          // come si calcola il punteggio
    if (e.code === 'KeyM') { mode = 'menu'; newRun(); }
    if (e.code === 'KeyH') openHelp();
  } else if (mode === 'help') {
    if (['ArrowRight', 'KeyD', 'Enter', 'Space'].includes(e.code)) {
      if (helpPage < HELP.length - 1) helpPage++; else closeHelp();
    }
    if (['ArrowLeft', 'KeyA'].includes(e.code)) helpPage = Math.max(0, helpPage - 1);
    if (e.code === 'Escape' || e.code === 'KeyH') closeHelp();
  }
});
function openHelp() { helpFrom = mode; mode = 'help'; helpPage = 0; }
function closeHelp() { mode = helpFrom; }
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
addEventListener('pagehide', () => { if (mode === 'run' || (mode === 'help' && helpFrom === 'run')) logRun('abandoned'); });
const down = (...c) => c.some(k => keys[k]);
// tasti che governano la nave (servono solo a misurare l'ingaggio: non si registra quale tasto)
const CONTROLS = ['KeyW', 'KeyS', 'KeyA', 'KeyD', 'KeyQ', 'KeyE', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

// ---------------------------------------------------------------------------
// Fisica
// ---------------------------------------------------------------------------
function damage(amount, why) {
  if (amount <= 0) return;
  S.hull -= amount; S.dmg += amount; S.flash = 1;
  banner = { text: `${why}  (-${Math.round(amount)}% integrità)`, t: 4, col: COL.bad };
  if (S.hull <= 0) finish('destroyed');
}

function step(dt) {
  if (mode === 'help') return;                    // guida aperta: tutto fermo
  S.clock += dt;
  if (mode === 'done' && S.dock) { settleDock(); return; }      // agganciata: la nave segue la stazione
  if (mode !== 'run') return;
  S.t += dt;
  S.aidTime[aids] += dt;

  const k = down('ShiftLeft', 'ShiftRight') ? P.fine : 1;
  const hx = Math.cos(S.th), hy = Math.sin(S.th);
  let ax = 0, ay = 0, tq = 0;
  const f = S.fl;
  f.main = f.rev = f.latL = f.latR = f.rotL = f.rotR = 0;
  const hasFuel = S.fuel > 0;

  // ingaggio: c'e' almeno un tasto di guida premuto in questo istante?
  if (CONTROLS.some(c => keys[c])) {
    S.active += dt;
    if (S.firstInput === null) S.firstInput = S.t;
    S.maxIdle = Math.max(S.maxIdle, S.idle); S.idle = 0;
  } else {
    S.idle += dt;
  }

  if (hasFuel) {
    if (down('KeyW', 'ArrowUp'))   { ax += hx * P.main * k; ay += hy * P.main * k; S.fuel -= P.useMain * k * dt; f.main = k; }
    if (down('KeyS', 'ArrowDown')) { ax -= hx * P.reverse * k; ay -= hy * P.reverse * k; S.fuel -= P.useRev * k * dt; f.rev = k; }
    if (opts.lateral) {
      if (down('KeyQ')) { ax += -hy * P.lateral * k; ay += hx * P.lateral * k; S.fuel -= P.useLat * k * dt; f.latL = k; }
      if (down('KeyE')) { ax -= -hy * P.lateral * k; ay -= hx * P.lateral * k; S.fuel -= P.useLat * k * dt; f.latR = k; }
    }
    if (down('KeyA', 'ArrowLeft'))  { tq += P.torque * k; S.fuel -= P.useRot * k * dt; f.rotL = k; }
    if (down('KeyD', 'ArrowRight')) { tq -= P.torque * k; S.fuel -= P.useRot * k * dt; f.rotR = k; }
  }
  if (S.fuel < 0) S.fuel = 0;

  if (tq === 0 && opts.assist && hasFuel) {      // assistente: mantiene l'assetto relativo alla stazione
    const diff = S.ws - S.w;
    const dw = Math.sign(diff) * Math.min(Math.abs(diff), P.assistTorque * dt);
    S.w += dw;
    if (Math.abs(diff) > 0.002) S.fuel -= P.useRot * 0.3 * dt;
  }
  S.w = clamp(S.w + tq * dt, -P.wMax, P.wMax);
  S.th += S.w * dt;
  S.vx += ax * dt; S.vy += ay * dt;
  S.x += S.vx * dt; S.y += S.vy * dt;

  collide();
  checkDock();
  if (mode === 'run') {
    const d = Math.hypot(S.x, S.y);
    if (d > 600 || (S.fuel <= 0 && d > 450)) finish('drift');
  }
}

// Dopo l'aggancio la nave diventa solidale con la stazione: in circa un secondo si porta con delicatezza
// nella posizione ideale (perpendicolare al portellone, muso inserito di 0,8 m) e poi ne segue il moto.
function settleDock() {
  const d = S.dock, p = portAt(S.clock);
  const k = clamp((S.clock - d.t0) / 1.4, 0, 1), e = k * k * (3 - 2 * k);       // andamento dolce
  const a = d.a + (P.noseLen - 0.8 - d.a) * e;
  const l = d.l * (1 - e);
  S.x = p.px + p.nx * a + p.tx * l; S.y = p.py + p.ny * a + p.ty * l;
  S.th = p.psi + Math.PI + d.e * (1 - e);
  S.vx = p.vx; S.vy = p.vy; S.w = S.ws;
  const f = S.fl; f.main = f.rev = f.latL = f.latR = f.rotL = f.rotR = 0;
}

function collide() {
  for (const o of solids()) {
    const [cx, cy] = o.type === 'c' ? [o.x, o.y] : closestOnSeg(o, S.x, S.y);
    const dx = S.x - cx, dy = S.y - cy;
    const d = Math.hypot(dx, dy) || 1e-6, min = P.shipR + o.r;
    if (d >= min) continue;
    const nx = dx / d, ny = dy / d;
    S.x += nx * (min - d); S.y += ny * (min - d);
    const qx = cx + nx * o.r, qy = cy + ny * o.r;            // punto di contatto
    const vn = (S.vx + S.ws * qy) * nx + (S.vy - S.ws * qx) * ny;
    if (vn < 0) {
      S.vx -= 1.3 * vn * nx; S.vy -= 1.3 * vn * ny;
      if (-vn > 0.4) S.hits++;
      damage(Math.max(0, -vn - 0.4) * 8, 'Urto con la stazione');
    }
  }
}

function checkDock() {
  const T = telemetry();
  if (S.prevA > 0 && T.a <= 0 && Math.abs(T.l) < 3) {
    const m = [T.closing / P.maxClose, T.lat / P.maxLat, Math.abs(T.err) / P.maxAng, Math.abs(T.rot) / P.maxRot];
    S.contact = { v: [T.closing, T.lat, Math.abs(T.err), Math.abs(T.rot)], m };      // valori al contatto e rapporto col limite
    if (m.every(v => v <= 1)) {
      S.dock = { t0: S.clock, a: (S.x - T.p.px) * T.p.nx + (S.y - T.p.py) * T.p.ny, l: (S.x - T.p.px) * T.p.tx + (S.y - T.p.py) * T.p.ty,
                 e: angDiff(S.th, T.p.psi + Math.PI) };       // posizione e angolo nel sistema del portellone
      finish('docked', m.every(v => v <= P.perfectFrac));
      return;
    }
    const names = ['velocità di avvicinamento', 'scivolamento', 'allineamento', 'rotazione'];
    const bad = names.filter((_, i) => m[i] > 1);
    if (m[0] > 1) S.failClose++;
    if (m[1] > 1) S.failLat++;
    if (m[2] > 1) S.failAng++;
    if (m[3] > 1) S.failRot++;
    const excess = m.reduce((s, v) => s + Math.max(0, v - 1), 0);
    const p = T.p;
    S.vx = p.vx + p.nx * (0.5 + 0.3 * Math.max(0, T.closing));
    S.vy = p.vy + p.ny * (0.5 + 0.3 * Math.max(0, T.closing));
    S.x += p.nx * (0.3 - T.a); S.y += p.ny * (0.3 - T.a);
    S.prevA = 0.3;
    S.bounces++;
    damage(Math.min(45, 10 + 15 * excess), 'Aggancio fallito: ' + bad.join(', ') + ' fuori tolleranza');
    return;
  }
  S.prevA = T.a;
}

function finish(kind, perfect) {
  mode = 'done';
  const speedBonus = Math.round(clamp(P.speedMax - P.speedRate * S.t, 0, P.speedMax));
  const fuelBonus = Math.round(S.fuel * P.fuelRate);
  const dmgPenalty = Math.round(S.dmg * P.dmgRate);
  doneDetails = false;
  // record: confronto con il massimo noto PRIMA di questo tentativo, poi lo si aggiorna
  const nuovoRecord = kind === 'docked' && recordGlobale !== null && P.scoreBase + speedBonus + fuelBonus + (perfect ? P.perfectBonus : 0) - dmgPenalty > recordGlobale;
  S.result = { kind, perfect, speedBonus, fuelBonus, dmgPenalty,
    perfectBonus: perfect ? P.perfectBonus : 0 };
  S.result.score = kind === 'docked'
    ? Math.max(0, P.scoreBase + speedBonus + fuelBonus + S.result.perfectBonus - dmgPenalty) : 0;
  S.result.newRecord = nuovoRecord;
  S.result.recordPrima = recordGlobale;
  if (recordGlobale !== null && S.result.score > recordGlobale) recordGlobale = S.result.score;
  logRun(kind === 'docked' ? 'docked' : kind);
}

// ---------------------------------------------------------------------------
// Camera (zoom automatico: piu' ti avvicini, piu' ingrandisce)
// ---------------------------------------------------------------------------
function updateCam(dt, snap) {
  const p = portAt(S.clock);
  const mx = (S.x + p.px) / 2, my = (S.y + p.py) / 2;
  const dist = Math.hypot(S.x - p.px, S.y - p.py);
  const half = Math.max(28, dist * 0.6 + 14);
  const target = 0.5 * Math.min(W - PANEL, H) / half;
  if (snap) { cam.x = mx; cam.y = my; cam.s = target; return; }
  const f = 1 - Math.exp(-dt * 3);
  cam.x += (mx - cam.x) * f; cam.y += (my - cam.y) * f;
  cam.s *= Math.pow(target / cam.s, f);
}
const sx = x => (W - PANEL) / 2 + (x - cam.x) * cam.s;
const sy = y => H / 2 - (y - cam.y) * cam.s;

// ---------------------------------------------------------------------------
// Disegno
// ---------------------------------------------------------------------------
const stars = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), d: 0.2 + Math.random() * 0.8 }));

function line(x1, y1, x2, y2, col, w, dash) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(sx(x1), sy(y1)); ctx.lineTo(sx(x2), sy(y2)); ctx.stroke();
  ctx.setLineDash([]);
}
function circle(x, y, r, stroke, fill, w) {
  ctx.beginPath(); ctx.arc(sx(x), sy(y), r * cam.s, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = w || 1.5; ctx.stroke(); }
}
function text(s, x, y, col, size, align) {
  ctx.fillStyle = col || COL.txt; ctx.font = `${size || 13}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textAlign = align || 'left'; ctx.fillText(s, x, y);
}

function drawStars() {
  ctx.fillStyle = '#9fb4c8';
  const aw = W - PANEL;
  for (const s of stars) {
    const x = (((s.x * aw - cam.x * cam.s * s.d * 0.05) % aw) + aw) % aw;
    const y = (((s.y * H + cam.y * cam.s * s.d * 0.05) % H) + H) % H;
    ctx.globalAlpha = 0.25 + 0.5 * s.d;
    ctx.fillRect(x, y, 1.4 * s.d + 0.4, 1.4 * s.d + 0.4);
  }
  ctx.globalAlpha = 1;
}

function drawStation() {
  const p = portAt(S.clock);
  const q = S.psi0 + Math.PI + S.ws * S.clock;
  const ex = Math.cos(q) * 34, ey = Math.sin(q) * 34;
  const bw = Math.max(1.5, 3 * cam.s);
  line(0, 0, ex, ey, COL.st, bw);
  circle(ex, ey, 6, COL.st, '#0e1722', 2);
  line(0, 0, p.px - 2 * p.nx, p.py - 2 * p.ny, COL.st, bw);
  circle(0, 0, P.hubR, COL.st, '#0e1722', 2);
  circle(0, 0, P.hubR * 0.6, '#35506b', null, 1);
  for (let i = 0; i < 4; i++) {                               // raggi del mozzo (mostrano la rotazione)
    const a = S.ws * S.clock + i * Math.PI / 2 + 0.5;
    line(Math.cos(a) * 4, Math.sin(a) * 4, Math.cos(a) * 14, Math.sin(a) * 14, '#35506b', 1);
  }
  // piastra di attracco con la finestra del porto
  const cx = p.px - p.nx, cy = p.py - p.ny;
  const pw = Math.max(2, 2 * cam.s);
  line(cx + p.tx * 3, cy + p.ty * 3, cx + p.tx * 12, cy + p.ty * 12, COL.st, pw);
  line(cx - p.tx * 3, cy - p.ty * 3, cx - p.tx * 12, cy - p.ty * 12, COL.st, pw);
  line(p.px + p.tx * 3, p.py + p.ty * 3, p.px - p.tx * 3, p.py - p.ty * 3, COL.port, Math.max(1.5, 0.6 * cam.s));
  // luci guida del porto
  for (const sgn of [-1, 1]) circle(p.px + p.tx * 3 * sgn + p.nx * 0.5, p.py + p.ty * 3 * sgn + p.ny * 0.5, 0.6, COL.port, COL.port);
}

function drawGuidance(withAxis) {
  const p = portAt(S.clock), L = 130, half = 14 * Math.PI / 180;
  ctx.fillStyle = 'rgba(255,179,71,0.05)';
  ctx.beginPath(); ctx.moveTo(sx(p.px), sy(p.py));
  for (const s of [-1, 1]) {
    const a = p.psi + s * half;
    ctx.lineTo(sx(p.px + Math.cos(a) * L), sy(p.py + Math.sin(a) * L));
  }
  ctx.closePath(); ctx.fill();
  if (withAxis) line(p.px, p.py, p.px + p.nx * L, p.py + p.ny * L, 'rgba(255,179,71,0.35)', 1, [6, 6]);
}

function drawPrediction() {
  ctx.font = '11px ui-monospace, Menlo, monospace'; ctx.textAlign = 'left';
  for (let k = 1; k <= 12; k++) {
    const pp = portAt(S.clock + k);
    const shx = S.x + S.vx * k, shy = S.y + S.vy * k;
    ctx.fillStyle = COL.port; ctx.globalAlpha = 0.7;
    ctx.fillRect(sx(pp.px) - 1.5, sy(pp.py) - 1.5, 3, 3);
    ctx.fillStyle = COL.ship;
    ctx.fillRect(sx(shx) - 1.5, sy(shy) - 1.5, 3, 3);
    ctx.globalAlpha = 1;
    if (k % 4 === 0) {
      ctx.fillStyle = COL.port; ctx.fillText(k + 's', sx(pp.px) + 5, sy(pp.py) - 5);
      ctx.fillStyle = COL.ship; ctx.fillText(k + 's', sx(shx) + 5, sy(shy) - 5);
    }
  }
}

function drawShip(showAim) {
  const sxp = sx(S.x), syp = sy(S.y), sc = Math.max(cam.s, 1.6);
  const aim = P.noseLen;
  if (showAim) line(S.x + Math.cos(S.th) * aim, S.y + Math.sin(S.th) * aim,
       S.x + Math.cos(S.th) * (aim + 140), S.y + Math.sin(S.th) * (aim + 140),
       'rgba(127,231,255,0.25)', 1, [3, 7]);
  ctx.save();
  ctx.translate(sxp, syp); ctx.rotate(-S.th); ctx.scale(sc, sc);
  const f = S.fl;
  ctx.fillStyle = '#ffd08a';
  if (f.main) { ctx.beginPath(); ctx.moveTo(-3, -1.2); ctx.lineTo(-3 - 4 * f.main - Math.random() * 1.5, 0); ctx.lineTo(-3, 1.2); ctx.fill(); }
  // Getti dei piccoli propulsori: stessa fiammella che sfarfalla del motore principale, ma piu' piccola e bianco-grigia.
  // Partono dal bordo dello scafo e escono nel verso OPPOSTO alla spinta.
  const jet = (x, y, dx, dy, k) => {
    const L = (1.7 + Math.random() * 0.8) * (0.55 + 0.45 * k), w = 0.62;          // lunghezza (con SHIFT k=0.3: piu' corto), mezza base
    const nx = -dy, ny = dx;                                                       // direzione perpendicolare al getto
    ctx.fillStyle = 'rgba(190,205,220,0.85)';                                      // alone bianco-grigio
    ctx.beginPath(); ctx.moveTo(x + nx * w, y + ny * w); ctx.lineTo(x + dx * L, y + dy * L); ctx.lineTo(x - nx * w, y - ny * w); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';                                      // nucleo piu' chiaro
    ctx.beginPath(); ctx.moveTo(x + nx * w * 0.45, y + ny * w * 0.45); ctx.lineTo(x + dx * L * 0.6, y + dy * L * 0.6); ctx.lineTo(x - nx * w * 0.45, y - ny * w * 0.45); ctx.fill();
  };
  if (f.rev) { jet(2.6, 0.64, 1, 0, f.rev); jet(2.6, -0.64, 1, 0, f.rev); }         // frenata: getti in avanti
  if (f.latL) jet(0, 1.72, 0, 1, f.latL);                                            // Q spinge a sinistra: getto a destra
  if (f.latR) jet(0, -1.72, 0, -1, f.latR);                                          // E spinge a destra: getto a sinistra
  if (f.rotL) { jet(3, 0.43, 0, 1, f.rotL); jet(-3, -3, 0, -1, f.rotL); }           // A: il muso va a sinistra, la coda a destra
  if (f.rotR) { jet(3, -0.43, 0, -1, f.rotR); jet(-3, 3, 0, 1, f.rotR); }           // D: il contrario
  ctx.fillStyle = S.flash > 0 ? '#ff8a8a' : '#10202e';
  ctx.strokeStyle = S.flash > 0 ? COL.bad : COL.ship; ctx.lineWidth = 1.2 / sc * Math.max(1, sc / 2);
  ctx.beginPath();
  ctx.moveTo(P.noseLen, 0); ctx.lineTo(-3, 3); ctx.lineTo(-1.8, 0); ctx.lineTo(-3, -3); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawRelVelocity(T) {
  const p = T.p;
  const rvx = S.vx - p.vx, rvy = S.vy - p.vy;
  const sp = Math.hypot(rvx, rvy);
  if (sp < 0.05) return;
  const len = Math.min(60, sp * 12);
  line(S.x, S.y, S.x + rvx / sp * len, S.y + rvy / sp * len, COL.good, 1.5);
}

function level(v, max) { return v <= max ? COL.good : v <= 1.5 * max ? COL.warn : COL.bad; }

function bar(x, y, w, frac, col) {
  ctx.fillStyle = '#16202b'; ctx.fillRect(x, y, w, 6);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * clamp(frac, 0, 1), 6);
}

function row(label, valStr, v, max, y) {
  const x = W - PANEL + 16, w = PANEL - 32, col = level(v, max);
  text(label, x, y, COL.dim, 12);
  text(valStr, x + w, y, col, 14, 'right');
  ctx.fillStyle = '#16202b'; ctx.fillRect(x, y + 6, w, 5);
  ctx.fillStyle = col; ctx.fillRect(x, y + 6, w * clamp(v / (2 * max), 0, 1), 5);
  ctx.fillStyle = COL.txt; ctx.fillRect(x + w / 2 - 1, y + 3, 2, 11);       // limite di tolleranza
}

function fitText(str, x, y, maxW, col, size) {          // rimpicciolisce il testo finche' entra in maxW
  let sz = size;
  ctx.font = `${sz}px ui-monospace, Menlo, Consolas, monospace`;
  const w = ctx.measureText(str).width;
  if (w > maxW) sz = Math.max(8, Math.floor(size * maxW / w * 10) / 10);
  text(str, x, y, col, sz);
}

function drawHud() {
  const T = telemetry();
  ctx.fillStyle = 'rgba(8,13,20,0.92)'; ctx.fillRect(W - PANEL, 0, PANEL, H);
  ctx.fillStyle = '#1b2a3a'; ctx.fillRect(W - PANEL, 0, 1, H);
  const x = W - PANEL + 16, w = PANEL - 32;
  text('DOCKING', x, 28, COL.ship, 15);
  text('distanza', x, 56, COL.dim, 12); text(T.dist.toFixed(1) + ' m', x + w, 56, COL.txt, 14, 'right');
  const eta = T.closing > 0.05 && T.a > 0 ? Math.round(T.a / T.closing) + ' s' : '--';
  text('contatto fra', x, 76, COL.dim, 12); text(eta, x + w, 76, COL.txt, 14, 'right');
  text('offset laterale', x, 96, COL.dim, 12); text(T.l.toFixed(1) + ' m', x + w, 96, Math.abs(T.l) < 3 ? COL.good : COL.txt, 14, 'right');

  const cl = T.closing;
  row(cl < 0 ? 'ti allontani' : 'avvicinamento', Math.abs(cl).toFixed(2) + ' m/s', Math.max(0, cl), P.maxClose, 128);
  row('velocità laterale', T.lat.toFixed(2) + ' m/s', T.lat, P.maxLat, 164);
  row('errore d\'angolo', Math.abs(T.err).toFixed(0) + '°', Math.abs(T.err), P.maxAng, 200);
  row('rotazione relativa', Math.abs(T.rot).toFixed(2) + ' rad/s', Math.abs(T.rot), P.maxRot, 236);
  text('la tacca bianca è il limite per agganciare', x, 266, COL.dim, 10);

  const hullCol = S.hull > 50 ? COL.good : S.hull > 20 ? COL.warn : COL.bad;
  text('INTEGRITÀ SCAFO', x, 304, COL.dim, 12); text(Math.max(0, Math.round(S.hull)) + '%', x + w, 304, hullCol, 14, 'right'); bar(x, 310, w, S.hull / 100, hullCol);
  text('PROPELLENTE', x, 340, COL.dim, 12); bar(x, 346, w, S.fuel / P.fuel, S.fuel > 15 ? COL.good : S.fuel > 6 ? COL.warn : COL.bad);
  const bonus = Math.round(clamp(P.speedMax - P.speedRate * S.t, 0, P.speedMax));
  text('tempo', x, 386, COL.dim, 12); text(S.t.toFixed(0) + ' s', x + w, 386, COL.txt, 14, 'right');
  text('bonus rapidità', x, 406, COL.dim, 12); text('+' + bonus, x + w, 406, bonus > 0 ? COL.warn : COL.dim, 14, 'right');

  fitText(`stabilizzatore ${opts.assist ? 'SI' : 'no'}  |  laterali ${opts.lateral ? 'SI' : 'no'}`, x, H - 142, w, COL.dim, 11);
  fitText(`stazione ${SPIN_NAMES[opts.spin]}  |  aiuti ${AIDS_NAMES[aids]}`, x, H - 126, w, COL.dim, 11);
  const help = ['↑ ↓ ← → (o WASD)  spinta e rotazione', opts.lateral ? 'Q / E  spinta laterale' : '', 'SHIFT + tasto  correzioni fini (30%)', 'P aiuti   INVIO riprova', 'M menu   H guida'];
  help.forEach((h, i) => fitText(h, x, H - 100 + i * 17, w, COL.dim, 12));
}

function overlay(lines, title, tcol) {
  // lines: [testo, colore] | [testo, colore, {center:true}] | [null, null, {opt:{n,label,values,sel}}]
  // Il riquadro si adatta alla riga piu' lunga; se non entra nello schermo il testo si rimpicciolisce.
  const avail = W - PANEL - 20, pad = 36;
  const font = (sz, bold) => `${bold ? 'bold ' : ''}${sz}px ui-monospace, Menlo, Consolas, monospace`;
  const optRows = lines.filter(l => l[2] && l[2].opt).map(l => l[2].opt);
  const measure = sz => {
    ctx.font = font(sz);
    const labW = Math.max(0, ...optRows.map(o => ctx.measureText(o.n + '   ' + o.label).width));
    let w = 360;
    for (const l of lines) {
      if (l[2] && l[2].opt) {
        const chips = l[2].opt.values.reduce((a, v) => a + ctx.measureText(v).width + 14 + 6, 0);
        w = Math.max(w, labW + 32 + chips);
      } else w = Math.max(w, ctx.measureText(l[0]).width);
    }
    return { w, labW };
  };
  let size = 14;
  const need = measure(size).w;
  if (need + pad * 2 > avail) size = Math.max(9, Math.floor(size * (avail - pad * 2) / need * 10) / 10);
  size = Math.max(9, Math.min(size, (H - 120) / (lines.length * 1.7)));          // e che entri in altezza
  const m = measure(size);
  const bw = Math.min(avail, m.w + pad * 2);
  const lh = Math.round(size * 1.7), bh = 90 + lines.length * lh;
  const bx = (W - PANEL - bw) / 2, by = Math.max(10, H - bh - 24);
  ctx.fillStyle = 'rgba(5,9,15,0.92)'; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = tcol; ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, bw, bh);
  text(title, bx + bw / 2, by + 42, tcol, 22, 'center');
  lines.forEach((l, i) => {
    const y = by + 82 + i * lh, ex = l[2] || {};
    if (ex.opt) {                                         // riga-opzione: etichetta + valori; quello scelto e' evidenziato
      const o = ex.opt;
      text(o.n, bx + pad, y, COL.ship, size);
      text(o.label, bx + pad + ctx.measureText(o.n + '   ').width, y, COL.txt, size);
      let cx = bx + pad + m.labW + 32;
      o.values.forEach((v, k) => {
        ctx.font = font(size);
        const cw = ctx.measureText(v).width + 14;
        if (k === o.sel) {
          ctx.fillStyle = COL.ship; ctx.fillRect(cx, y - size * 1.05, cw, size * 1.5);
          ctx.font = font(size, true); ctx.fillStyle = '#05070d'; ctx.textAlign = 'center';
          ctx.fillText(v.toUpperCase(), cx + cw / 2, y);
        } else text(v, cx + cw / 2, y, COL.dim, size, 'center');
        cx += cw + 6;
      });
    } else if (ex.center) text(l[0], bx + bw / 2, y, l[1] || COL.txt, size, 'center');
    else text(l[0], bx + pad, y, l[1] || COL.txt, size);
  });
}

      ['È necessario rispettare quattro parametri (tieni sotto controllo i valori limite nel pannello a destra):', T_],
      ['  1  velocità:      avvicinamento al portellone < 1,2 m/s', D_],
      ['  2  scivolamento:  velocità di lato rispetto al portellone < 0,8 m/s', D_],
      ['  3  allineamento:  asse della nave parallelo all\'asse del portellone (errore < 12 gradi)', D_],
      ['  4  rotazione:     sincrona rispetto alla stazione < 0,12 rad/s', D_],
      ["Se non rispetti i parametri d'arrivo rimbalzi e perdi integrità dello scafo.", T_],
      ['', T_],
      ['COMANDI', O_],
      ['  ↑ / ↓   (o W / S)        spinta avanti / indietro', T_],
      ['  ← / →   (o A / D)        ruota la nave', T_],
      ['  Q / E                    spinta laterale sinistra / destra', T_],
      ['  SHIFT + un altro tasto   stesso comando ma al 30% della forza', T_],
      ['                           (es. SHIFT + S = frenata leggera)', D_],
      ['  P                        cambia gli aiuti visivi', T_],
      ['  INVIO                    ricomincia il tentativo', T_],
      ['  M                        torna al menu', T_],
      ['', T_],
      ['OPZIONI  seleziona il numero per cambiarle', O_],
      [null, null, { opt: { n: '1', label: 'Ferma automaticamente la rotazione della nave', values: ['si', 'no'], sel: opts.assist ? 0 : 1 } }],
      [null, null, { opt: { n: '2', label: 'Propulsori laterali (Q / E)', values: ['si', 'no'], sel: opts.lateral ? 0 : 1 } }],
      [null, null, { opt: { n: '3', label: 'Rotazione stazione', values: SPIN_NAMES, sel: opts.spin } }],
      [null, null, { opt: { n: '4', label: 'Aiuti visivi', values: AIDS_NAMES, sel: aids } }],
      ['', T_],
      ['H  guida in 5 pagine (comandi, SHIFT, stabilizzatore, aiuti)', B_],
      ...(LOG_ON ? [['Test: raccoglie dati anonimi di gioco, nessun dato personale.', D_]]
                 : LOCALE ? [['ANTEPRIMA LOCALE: i dati di gioco non vengono inviati.', COL.warn]] : []),
      ['', T_],
      ['Premi INVIO per iniziare', O_, { center: true }],
    ], 'SPACE TRUCKER  -  docking', N_);
  } else if (mode === 'done') {
    const r = S.result;
    const riga = (a, b) => a.padEnd(28) + b;
    if (doneDetails) {
      const lim = [P.maxClose, P.maxLat, P.maxAng, P.maxRot];
      const unita = ['m/s', 'm/s', '°', 'rad/s'], dec = [2, 2, 0, 2];
      const nomi = ['velocità', 'scivolamento', 'allineamento', 'rotazione'];
      const cr = S.contact;
      const tab = [['AL CONTATTO'.padEnd(15) + 'valore'.padEnd(13) + 'limite'.padEnd(12) + 'per il perfetto', O_]];
      nomi.forEach((n, i) => {
        if (!cr) { tab.push([n.padEnd(15) + '-', D_]); return; }
        const v = cr.v[i], ratio = cr.m[i];
        const stato = ratio <= P.perfectFrac ? 'perfetto' : ratio <= 1 ? 'ok' : 'fuori limite';
        const colr = ratio <= P.perfectFrac ? COL.good : ratio <= 1 ? COL.warn : COL.bad;
        tab.push([n.padEnd(15) + (v.toFixed(dec[i]) + ' ' + unita[i]).padEnd(13) + ('< ' + String(lim[i]).replace('.', ',')).padEnd(12)
          + ('≤ ' + (lim[i] * P.perfectFrac).toFixed(dec[i]).replace('.', ',')).padEnd(10) + stato, colr]);
      });
      overlay([
        ['COME SI CALCOLA IL PUNTEGGIO', O_],
        [`Base                  ${P.scoreBase}   aggancio riuscito`, T_],
        [`Rapidità              ${r.speedBonus >= 0 ? '+' : ''}${r.speedBonus}   ${P.speedMax} - ${P.speedRate} punti per ogni secondo (tempo: ${S.t.toFixed(0)} s)`, T_],
        [`Propellente           +${r.fuelBonus}   ${P.fuelRate} punti per ogni unità rimasta (${S.fuel.toFixed(0)})`, T_],
        [`Aggancio perfetto     +${r.perfectBonus}   +${P.perfectBonus} se tutti e 4 i parametri sono entro il ${Math.round(P.perfectFrac * 100)}% del limite`, r.perfect ? COL.good : T_],
        [`Danni                 -${r.dmgPenalty}   ${P.dmgRate} punti per ogni 1% di integrità persa (${Math.round(S.dmg)}%)`, r.dmgPenalty ? COL.bad : T_],
        [`TOTALE: ${r.score}`, COL.warn],
        ['', T_],
        ...tab,
        ['', T_],
        ['SPAZIO: torna al riepilogo     INVIO riprova     M menu', O_, { center: true }],
      ], 'DETTAGLI DEL PUNTEGGIO', COL.warn);
    } else if (r.kind === 'docked') {
      overlay([
        [`Tempo: ${S.t.toFixed(0)} s    Propellente rimasto: ${S.fuel.toFixed(0)}    Integrità scafo: ${Math.max(0, Math.round(S.hull))}%`, T_],
        ['', T_],
        [riga('Base', '+' + P.scoreBase), T_],
        [riga('Rapidità', '+' + r.speedBonus), T_],
        [riga('Propellente', '+' + r.fuelBonus), T_],
        [riga('Aggancio perfetto', '+' + r.perfectBonus), r.perfect ? COL.good : COL.dim],
        [riga('Penalità per i danni', '-' + r.dmgPenalty), r.dmgPenalty ? COL.bad : COL.dim],
        [`PUNTEGGIO: ${r.score}`, COL.warn],
        ...(r.newRecord ? [['CONGRATULAZIONI! HAI STABILITO IL NUOVO PUNTEGGIO MASSIMO', COL.good, { center: true }]]
          : recordGlobale !== null ? [[`Il punteggio massimo è ${recordGlobale}`, D_, { center: true }]] : []),
        ['', T_],
        ['SPAZIO: come si calcola il punteggio', D_, { center: true }],
        ['INVIO riprova     M menu     H guida', O_, { center: true }],
      ], r.perfect ? 'AGGANCIO PERFETTO' : 'AGGANCIO RIUSCITO', COL.good);
    } else {
      overlay([
        [r.kind === 'destroyed' ? 'L\'integrità dello scafo è arrivata a 0%.' : 'Sei andato alla deriva.', T_],
        ['', T_],
        ['SPAZIO: dettagli dell\'ultimo contatto', D_, { center: true }],
        ['INVIO riprova     M menu     H guida', O_, { center: true }],
      ], r.kind === 'destroyed' ? 'NAVE DISTRUTTA' : 'ALLA DERIVA', COL.bad);
    }
  }
  if (banner && mode !== 'menu') {
    ctx.globalAlpha = clamp(banner.t, 0, 1);
    text(banner.text, (W - PANEL) / 2, 40, banner.col, 15, 'center');
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W - PANEL, H); ctx.clip();
  // livelli: 0 completo, 1 essenziale (cono + mira), 2 nullo (solo il pannello)
  drawStars();
  if (aids <= 1) drawGuidance(aids === 0);
  drawStation();
  if (aids === 0) { drawPrediction(); drawRelVelocity(telemetry()); }
  drawShip(aids <= 1);
  ctx.restore();
  text('Space Trucker prototipo docking  v' + VERSION, 12, H - 12, 'rgba(160,180,200,0.55)', 11);
  if (mode === 'run' && down('ShiftLeft', 'ShiftRight')) text('CONTROLLO FINE  30%', (W - PANEL) / 2, 70, COL.warn, 14, 'center');
  if (logNote.t > 0) text(logNote.text, 12, H - 28, 'rgba(107,255,154,' + Math.min(1, logNote.t) * 0.8 + ')', 11);
  drawHud(); drawOverlays();
}

// ---------------------------------------------------------------------------
// Ciclo principale (passo fisico fisso a 120 Hz)
// ---------------------------------------------------------------------------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  const h = 1 / 120;
  while (acc >= h) { step(h); acc -= h; }
  if (S.flash > 0) S.flash -= dt * 2;
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (logNote.t > 0) logNote.t -= dt;
  updateCam(dt, false);
  render();
  requestAnimationFrame(frame);
}
newRun();
logEvent('visit', {
  browser: browserName(), touch: navigator.maxTouchPoints > 0,
  screen: screen.width + 'x' + screen.height, viewport: innerWidth + 'x' + innerHeight,
  lang: navigator.language, ref: document.referrer ? new URL(document.referrer).hostname : '',
});
caricaRecord();
requestAnimationFrame(frame);
</script>
</body>
</html>
