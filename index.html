<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Trucker - Prototipo docking</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  SPACE TRUCKER - prototipo docking 2D
  Obiettivo del prototipo: capire se la manovra con inerzia e' piacevole.
  Un solo file, nessuna dipendenza. Tutti i numeri da regolare sono in P (sotto).
*/

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, PANEL = 280;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  PANEL = clamp(Math.round(W * 0.3), 230, 300);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// Parametri di gioco (unita': metri, secondi, radianti)
// ---------------------------------------------------------------------------
const P = {
  main: 2.0, reverse: 1.0, lateral: 0.7,       // accelerazioni (m/s^2)
  torque: 0.9, wMax: 1.2, assistTorque: 0.7,   // rotazione (rad/s^2, rad/s)
  fine: 0.3,                                   // fattore con SHIFT (controllo fine)
  pannelloDopoEsplosione: 2.6,                 // secondi fra la distruzione e il pannello dei risultati (animazione dell'esplosione)
  pannelloDopo: 3.4,                           // secondi fra l'aggancio e la comparsa del pannello dei risultati (assestamento + finestrini che si accendono)
  fuel: 60, useMain: 0.5, useRev: 0.3, useLat: 0.25, useRot: 0.12,
  hubR: 16, boomR: 44,                         // geometria stazione
  maxClose: 1.2, maxLat: 0.8, maxAng: 12, maxRot: 0.12,  // tolleranze di aggancio
  startMin: 220, startVar: 60,
  // punteggio (da tarare con i dati dei test)
  scoreBase: 400, speedMax: 600, speedRate: 6,   // rapidita': 600 - 6 punti per ogni secondo, mai sotto zero
  fuelRate: 3, perfectBonus: 300, dmgRate: 8,    // 3 pt/unita' di propellente, +300 se perfetto, -8 pt per ogni 1% di integrita' persa
  // indice di ingaggio (0-100): media di 3 componenti, ciascuna con il suo tetto
  engPpm: 30, engIdle: 40, engActive: 0.4,       // 30 pressioni/min = 100; 40 s senza input = 0; 40% del tempo con un tasto premuto = 100
  perfectFrac: 0.5,                              // "perfetto" = tutti e 4 i parametri entro il 50% del limite
};
const VERSION = '0.4.1';                         // da aggiornare a ogni build condivisa
// Stazione SNODO: due porti, uno per braccio, speculari (come docs/stazione-snodo.svg). Il porto e' un OGGETTO con un tipo di portello:
//  imbuto  = bocca di 6 m (mezza 3,0) che si stringe: agganci facili
//  collare = foro di 3,4 m (mezza 1,7) con un labbro in fuori: agganci precisi
// 'mezza' = mezza larghezza della bocca a livello del piano del porto; l'anello della nave deve passarci (mezza - anelloMezzo).
const PORTE = [{ id: 'A', ang: 0, tipo: 'imbuto' }, { id: 'B', ang: Math.PI, tipo: 'collare' }];
const TIPI_PORTO = { imbuto: { mezza: 3.0 }, collare: { mezza: 1.7 } };
const STAZIONE = 'snodo';
const SPINS = [0, 0.02, 0.04, 0.06];           // rad/s della stazione
const SPIN_NAMES = ['ferma', 'piano', 'medio', 'veloce'];
const opts = { assist: true, lateral: true, spin: 0, sound: true };      // sound: acceso di default (parte al primo tasto premuto: i browser non permettono prima)
const AIDS_NAMES = ['completo', 'essenziale', 'nullo'];
let aids = 0;                                  // livello degli aiuti visivi (P in gioco, [4] nel menu)

// ---------------------------------------------------------------------------
// Raccolta dati anonimi dei test (nessun IP, nessun cookie: solo un codice casuale per sessione)
// Per attivarla incolla qui l'indirizzo dell'app web Google (finisce con /exec). Vuoto = disattivata.
// ---------------------------------------------------------------------------
const LOG_URL = 'https://script.google.com/macros/s/AKfycbwsUqKaMB5q3vQoT0KtUqIEEuVpVHRJU5uMuFaZ7jUvCkmjrpnMcBj86JWXHZkLhUxq/exec';
// In locale (file aperto con doppio click o localhost) i dati NON si inviano, per non sporcare i test veri.
// Per forzare l'invio anche in locale: aggiungi ?log=1 all'indirizzo.
const LOCALE = location.protocol === 'file:' || ['localhost', '127.0.0.1', '::1', '[::1]'].includes(location.hostname);
const LOG_ON = !!LOG_URL && (!LOCALE || new URLSearchParams(location.search).get('log') === '1');
const SESSION = Math.random().toString(36).slice(2, 10);
let attempt = 0;

function logEvent(type, data) {
  if (!LOG_ON) return;
  try {
    fetch(LOG_URL, {
      method: 'POST', mode: 'no-cors', keepalive: true,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },     // evita il controllo CORS preliminare
      body: JSON.stringify(Object.assign({ type, session: SESSION, version: 'v' + VERSION }, data)),   // 'v' evita che il foglio legga 0.2.2 come un orario
    }).catch(() => {});
  } catch (e) { /* la registrazione non deve mai disturbare il gioco */ }
}

function browserName() {
  const u = navigator.userAgent;
  if (/Edg\//.test(u)) return 'Edge';
  if (/OPR\//.test(u)) return 'Opera';
  if (/Firefox\//.test(u)) return 'Firefox';
  if (/Chrome\//.test(u)) return 'Chrome';
  if (/Safari\//.test(u)) return 'Safari';
  return 'altro';
}

// Indice di ingaggio 0-100: quanto il giocatore interagisce, in tre componenti uguali.
//  frequenza = pressioni al minuto; presenza = quanto a lungo non ha mai mollato (pausa piu' lunga);
//  attivita' = quota del tempo con almeno un tasto premuto. Fermarsi a osservare e' normale (la nave
//  prosegue per inerzia), per questo i tetti sono bassi: l'indice serve a confrontare, non a giudicare.
function engagementIndex() {
  const t = Math.max(S.t, 0.1);
  const freq = Math.min(1, (S.presses / (t / 60)) / P.engPpm);
  const pres = 1 - Math.min(1, Math.max(S.maxIdle, S.idle) / P.engIdle);
  const att = Math.min(1, (S.active / t) / P.engActive);
  return Math.round(100 * (freq + pres + att) / 3);
}

// Punteggio massimo di tutti i test (senza nomi): si legge dal foglio all'apertura della pagina.
// Se la lettura fallisce (offline, ecc.) il gioco funziona uguale e semplicemente non mostra la riga.
let recordGlobale = null;
function caricaRecord() {
  if (!LOG_URL) return;
  fetch(LOG_URL + '?azione=max').then(r => r.json())
    .then(d => { if (typeof d.max === 'number') recordGlobale = Math.max(recordGlobale || 0, d.max); })
    .catch(() => {});
}

const ESITI = { docked: 'agganciato', destroyed: 'distrutto', drift: 'alla deriva', abandoned: 'abbandonato' };
const sino = v => (v ? 'si' : 'no');
let logNote = { text: '', t: 0 };                    // conferma "dati inviati" mostrata a schermo

function logRun(result) {
  if (S.logged || S.t < 2) return;                 // niente righe per prove di pochi secondi
  S.logged = true;
  const esito = ESITI[result] || result;
  logEvent('run', {
    attempt: ++attempt, result: esito, perfect: sino(S.result && S.result.perfect),
    time: Math.round(S.t * 10) / 10, fuel: Math.round(S.fuel), hull: Math.max(0, Math.round(S.hull)),
    dmg: Math.round(S.dmg), bounces: S.bounces, hits: S.hits,
    score: S.result ? S.result.score : 0,
    assist: sino(opts.assist), lateral: sino(opts.lateral), spin: SPIN_NAMES[opts.spin], sound: sino(opts.sound),
    station: STAZIONE, port: PORTE[S.dock ? S.dock.i : S.pt].id, portType: PORTE[S.dock ? S.dock.i : S.pt].tipo,
    presses: S.presses, active: Math.round(100 * S.active / Math.max(S.t, 0.1)),
    idleMax: Math.round(Math.max(S.maxIdle, S.idle) * 10) / 10,
    firstInput: Math.round((S.firstInput === null ? S.t : S.firstInput) * 10) / 10,
    failClose: S.failClose, failLat: S.failLat, failAng: S.failAng, failRot: S.failRot,
    engagement: engagementIndex(),
    aids: AIDS_NAMES[S.aidTime.indexOf(Math.max(...S.aidTime))],      // livello usato per piu' tempo
    aidChanges: S.aidSwitches,
    // valori dei 4 parametri nell'ultimo contatto col portellone (vuoti se non c'e' stato contatto)
    cVel: S.contact ? Math.round(S.contact.v[0] * 100) / 100 : '', cLat: S.contact ? Math.round(S.contact.v[1] * 100) / 100 : '',
    cAng: S.contact ? Math.round(S.contact.v[2] * 10) / 10 : '', cRot: S.contact ? Math.round(S.contact.v[3] * 1000) / 1000 : '',
  });
  if (LOG_ON) logNote = { text: `dati inviati: tentativo ${attempt} (${esito})`, t: 6 };
}

// ---------------------------------------------------------------------------
// Utilita'
// ---------------------------------------------------------------------------
function angDiff(a, b) {
  let d = (a - b) % (2 * Math.PI);
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  return d;
}
const COL = { bg: '#05070d', st: '#6f8fb0', port: '#ffb347', ship: '#7fe7ff',
              good: '#6bff9a', warn: '#ffd75e', bad: '#ff6b6b', dim: '#6c7a89', txt: '#d6e2ee' };

// ---------------------------------------------------------------------------
// Stato
// ---------------------------------------------------------------------------
let S, mode = 'menu', banner = null;
let helpPage = 0, helpFrom = 'menu', doneDetails = false;
const cam = { x: 0, y: 0, s: 1 };

function newRun() {
  const ang = Math.random() * Math.PI * 2;
  const dist = P.startMin + Math.random() * P.startVar;
  S = {
    clock: 0, t: 0,                            // clock: fase stazione; t: tempo di missione
    psi0: Math.random() * Math.PI * 2, ws: SPINS[opts.spin],
    x: Math.cos(ang) * dist, y: Math.sin(ang) * dist,
    vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5,
    th: Math.random() * Math.PI * 2, w: (Math.random() - 0.5) * 0.2,
    fuel: P.fuel, hull: 100, dmg: 0, prevA: 1, flash: 0, bounces: 0, hits: 0, logged: false,
    presses: 0, active: 0, idle: 0, maxIdle: 0, firstInput: null,
    contact: null, dock: null, pt: 0,
    failClose: 0, failLat: 0, failAng: 0, failRot: 0, aidTime: [0, 0, 0], aidSwitches: 0,
    fl: { main: 0, rev: 0, latL: 0, latR: 0, rotL: 0, rotR: 0 },
    nextHull: 0, nextFuel: 0, blinkHull: -9, blinkFuel: -9, muteHull: false, muteFuel: false, crit2Hull: false, crit2Fuel: false, boom: null,       // allarmi ripetuti ogni secondo e relativo lampeggio; esplosione
    result: null,
  };
  banner = null;
  updateCam(0, true);
}


// ---------------------------------------------------------------------------
// GEOMETRIA UNICA. Ogni elemento e' definito UNA volta come insieme di forme in metri; lo stesso insieme serve a disegnare
// e a calcolare le collisioni (volume nel codice = volume disegnato). Regole in docs/piano-geometria-destriero-snodo.md.
//  nave: poligoni CONVESSI in coordinate locali, x verso il muso e y verso destra, origine nel baricentro.
// ---------------------------------------------------------------------------
const esc = (pts, sx, sy) => pts.map(([x, y]) => [x * sx, y * sy]);
const MULO = (() => {                                  // 6 x 3 m. Misure dal disegno docs/flotta-astronavi.svg (scala 0,65 x 0,95)
  const k = pts => esc(pts, 0.65, 0.95);
  return {
    nome: 'Mulo',
    parti: [                                           // nell'ordine di disegno
      { stile: 'pannello', pts: k([[-2.9, 1.45], [0.4, 1.45], [0.4, 1.61], [-2.9, 1.61]]) },
      { stile: 'pannello', pts: k([[-2.9, -1.61], [0.4, -1.61], [0.4, -1.45], [-2.9, -1.45]]) },
      { stile: 'scafo', pts: k([[-3.65, -0.55], [-4.7, -0.95], [-4.7, 0.95], [-3.65, 0.55]]) },                        // campana del motore
      { stile: 'scafo', pts: k([[3.0, -1.15], [-3.0, -1.15], [-3.5, -1.1], [-3.7, -0.7], [-3.7, 0.7], [-3.5, 1.1],
                                [-3.0, 1.15], [3.0, 1.15], [3.2, 1.1], [3.3, 0.85], [3.3, -0.85], [3.2, -1.1]]) },       // scafo con angoli arrotondati
      { stile: 'scafo', pts: k([[3.3, -0.75], [3.6, -0.75], [3.6, 0.75], [3.3, 0.75]]) },                              // anello di aggancio
      { stile: 'scafo', pts: k([[3.6, -0.3], [4.5, -0.2], [4.5, 0.2], [3.6, 0.3]]) },                                  // sonda
    ],
    punta: 4.5 * 0.65,                                 // punta della sonda: il punto che deve attraversare il piano del porto
    anelloMezzo: 0.75 * 0.95,                          // mezza larghezza dell'anello: deve passare nella finestra
    ugelli: { main: [-3.055, 0], front: 1.95, rear: -2.145, fy: 1.235, lat: -0.325, ly: 1.264 },   // posizioni degli ugelli (m)
  };
})();
const SHIP = MULO;

// Nave nel mondo: ogni parte come poligono in coordinate di mondo (y del mondo verso l'alto).
function shipWorld() {
  const hx = Math.cos(S.th), hy = Math.sin(S.th), rx = Math.sin(S.th), ry = -Math.cos(S.th);     // avanti e destra
  return SHIP.parti.map(p => p.pts.map(([x, y]) => [S.x + x * hx + y * rx, S.y + x * hy + y * ry]));
}

// Stazione: forme in coordinate di mondo, a un dato istante (ruota intorno all'origine).
function barra(ax, ay, bx, by, hw) {                  // rettangolo da (a) a (b), larghezza totale 2*hw, estremi piatti
  const dx = bx - ax, dy = by - ay, l = Math.hypot(dx, dy) || 1, nx = -dy / l * hw, ny = dx / l * hw;
  return [[ax + nx, ay + ny], [bx + nx, by + ny], [bx - nx, by - ny], [ax - nx, ay - ny]];
}
// Segmenti dell'anello luminoso di un porto (coordinate di mondo): lungo i bordi interni della bocca, sulla sagoma reale delle ali.
function segmentiAnello(p, tipo) {
  const pt = (s, l, d) => [p.px + p.tx * l * s + p.nx * d, p.py + p.ty * l * s + p.ny * d];     // d > 0 verso la nave, d < 0 verso la stazione
  const out = [];
  for (const s of [-1, 1]) {
    if (tipo === 'imbuto') out.push([pt(s, 3.0, 0), pt(s, 1.5, -2)]);                                  // bordo obliquo dell'imbuto
    else { out.push([pt(s, 1.7, 1.2), pt(s, 1.7, -2)]); out.push([pt(s, 1.7, 1.2), pt(s, 2.0, 1.2)]); }   // parete interna del collare e punta del labbro
  }
  return out;
}
function distPuntoSegmento(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}
function ottagono(u0, u1, hw, c) {                    // modulo con angoli smussati (convesso); u = distanza lungo il braccio, v = di lato
  return [[u0 + c, -hw], [u1 - c, -hw], [u1, -hw + c], [u1, hw - c], [u1 - c, hw], [u0 + c, hw], [u0, hw - c], [u0, -hw + c]];
}
// Braccio (stile "modulare"): dal mozzo alla piastra del porto, in metri lungo l'asse del braccio. 'k' dice il materiale/ruolo.
const BRACCIO = [
  { k: 'modulo', u0: 14, u1: 21, hw: 2.3 }, { k: 'tubo', u0: 21, u1: 24, hw: 1.2 },
  { k: 'modulo', u0: 24, u1: 32, hw: 2.0 }, { k: 'tubo', u0: 32, u1: 36, hw: 1.2 },
  { k: 'testata', u0: 36, u1: 42, hw: 3.0 },
];
function stationShapes(clock) {
  const polys = [], cerchi = [{ k: 'mozzo', x: 0, y: 0, r: P.hubR }];
  PORTE.forEach((porta, i) => {
    const p = portAt(clock, i);
    const W = (u, v) => [p.nx * u + p.tx * v, p.ny * u + p.ty * v];                 // (u lungo il braccio, v di lato) -> mondo; il piano del porto e' u = 44
    for (const s of BRACCIO) {
      const pts = (s.k === 'tubo' ? [[s.u0, -s.hw], [s.u1, -s.hw], [s.u1, s.hw], [s.u0, s.hw]] : ottagono(s.u0, s.u1, s.hw, 0.6)).map(([u, v]) => W(u, v));
      polys.push({ k: s.k, i, hw: s.hw, u0: s.u0, u1: s.u1, pts });
    }
    for (const sg of [-1, 1]) {                        // ali della piastra, ANCORATE alla testata: la finestra si apre sulla faccia della testata
      if (porta.tipo === 'imbuto') {                   // cuneo (bocca 6 m -> gola 3 m) + blocco di fondo
        polys.push({ k: 'ala', i, pts: [W(44, sg * 3), W(44, sg * 12), W(42, sg * 12), W(42, sg * 1.5)] });
        polys.push({ k: 'ala', i, pts: [W(42, sg * 1.5), W(42, sg * 12), W(40.5, sg * 12), W(40.5, sg * 1.5)] });
      } else {                                         // collare: foro 3,4 m, ala spessa 3,5 m e labbro in fuori di 1,2 m
        polys.push({ k: 'ala', i, pts: [W(44, sg * 1.7), W(44, sg * 12), W(40.5, sg * 12), W(40.5, sg * 1.7)] });
        polys.push({ k: 'ala', i, pts: [W(44, sg * 1.7), W(44, sg * 2.0), W(45.2, sg * 2.0), W(45.2, sg * 1.7)] });
      }
    }
  });
  return { p: portAt(clock), polys, cerchi };
}

// ---- collisioni: asse di separazione (SAT) fra poligoni convessi, e fra poligono e cerchio ----
function proietta(pts, ax, ay) { let mn = Infinity, mx = -Infinity; for (const [x, y] of pts) { const d = x * ax + y * ay; if (d < mn) mn = d; if (d > mx) mx = d; } return [mn, mx]; }
function centroide(pts) { let x = 0, y = 0; for (const q of pts) { x += q[0]; y += q[1]; } return [x / pts.length, y / pts.length]; }
function satPolyPoly(A, B) {                          // null se non si toccano; altrimenti { d: penetrazione, nx, ny: normale da B verso A }
  let best = Infinity, bx = 0, by = 0;
  for (const Pg of [A, B]) for (let i = 0; i < Pg.length; i++) {
    const [x1, y1] = Pg[i], [x2, y2] = Pg[(i + 1) % Pg.length];
    let ax = y2 - y1, ay = -(x2 - x1); const l = Math.hypot(ax, ay) || 1; ax /= l; ay /= l;
    const [a0, a1] = proietta(A, ax, ay), [b0, b1] = proietta(B, ax, ay), o = Math.min(a1, b1) - Math.max(a0, b0);
    if (o <= 0) return null;
    if (o < best) { best = o; bx = ax; by = ay; }
  }
  const ca = centroide(A), cb = centroide(B);
  if ((ca[0] - cb[0]) * bx + (ca[1] - cb[1]) * by < 0) { bx = -bx; by = -by; }
  return { d: best, nx: bx, ny: by };
}
function satPolyCirc(A, cx, cy, r) {                  // normale dal cerchio verso il poligono
  let best = Infinity, bx = 0, by = 0, near = null, nd = Infinity;
  const prova = (ax, ay) => {
    const l = Math.hypot(ax, ay) || 1; ax /= l; ay /= l;
    const [a0, a1] = proietta(A, ax, ay), c = cx * ax + cy * ay, o = Math.min(a1, c + r) - Math.max(a0, c - r);
    if (o <= 0) return false;
    if (o < best) { best = o; bx = ax; by = ay; }
    return true;
  };
  for (let i = 0; i < A.length; i++) {
    const [x1, y1] = A[i], [x2, y2] = A[(i + 1) % A.length];
    if (!prova(y2 - y1, -(x2 - x1))) return null;
    const d = Math.hypot(x1 - cx, y1 - cy); if (d < nd) { nd = d; near = A[i]; }
  }
  if (!prova(near[0] - cx, near[1] - cy)) return null;
  const ca = centroide(A);
  if ((ca[0] - cx) * bx + (ca[1] - cy) * by < 0) { bx = -bx; by = -by; }
  return { d: best, nx: bx, ny: by };
}

// ---------------------------------------------------------------------------
// Stazione: geometria e porto di attracco (ruotano con la stazione)
// ---------------------------------------------------------------------------
function portAt(tc, i) {                              // i: indice del porto; se omesso, il porto bersaglio (S.pt)
  const k = i === undefined ? S.pt : i;
  const psi = S.psi0 + S.ws * tc + PORTE[k].ang;
  const nx = Math.cos(psi), ny = Math.sin(psi);
  const px = nx * P.boomR, py = ny * P.boomR;
  return { i: k, tipo: PORTE[k].tipo, mezza: TIPI_PORTO[PORTE[k].tipo].mezza, psi, nx, ny, tx: -ny, ty: nx, px, py, vx: -S.ws * py, vy: S.ws * px };
}
// Il bersaglio (telemetria, guida, zoom) e' il porto piu' vicino alla punta della nave; un po' di isteresi evita scatti quando sono equidistanti.
function aggiornaBersaglio() {
  if (S.dock) return;
  const tx = S.x + Math.cos(S.th) * SHIP.punta, ty = S.y + Math.sin(S.th) * SHIP.punta;
  const dist = i => { const p = portAt(S.clock, i); return Math.hypot(tx - p.px, ty - p.py); };
  const cur = dist(S.pt);
  for (let i = 0; i < PORTE.length; i++) if (i !== S.pt && dist(i) < cur * 0.85) { S.pt = i; break; }
}

// ---------------------------------------------------------------------------
// Telemetria: tutto cio' che serve al pannello e alla valutazione dell'aggancio
// ---------------------------------------------------------------------------
function telemetry() {
  const p = portAt(S.clock);
  const hx = Math.cos(S.th), hy = Math.sin(S.th);
  const nx = S.x + hx * SHIP.punta, ny = S.y + hy * SHIP.punta;
  const dx = nx - p.px, dy = ny - p.py;

  if (mode === 'run' && !e.repeat && CONTROLS.includes(e.code)) S.presses++;

  if (e.code === 'KeyN' && !e.repeat && mode !== 'help') {                 // suoni si/no, in qualsiasi momento
    toggleSound();

  }

    if (e.code === 'Digit1') { opts.assist = !opts.assist; newRun(); }
    if (e.code === 'Digit2') { opts.lateral = !opts.lateral; newRun(); }

  } else if (mode === 'run') {

    if (e.code === 'KeyM' || e.code === 'Escape') { logRun('abandoned'); mode = 'menu'; newRun(); }
    if (e.code === 'KeyP' && !e.repeat) {
      aids = (aids + 1) % AIDS_NAMES.length; S.aidSwitches++;
      banner = { text: 'aiuti visivi: ' + AIDS_NAMES[aids], t: 2, col: COL.ship };
    }
    if (e.code === 'Digit1' && !e.repeat) S.muteHull = !S.muteHull;                 // disinnesco (e riattivazione) dell'allarme sonoro: il lampeggio resta
    if (e.code === 'Digit2' && !e.repeat) S.muteFuel = !S.muteFuel;
    if (e.code === 'KeyH') openHelp();                 // la guida mette in pausa la partita

    }
    if (['ArrowLeft', 'KeyA'].includes(e.code)) helpPage = Math.max(0, helpPage - 1);

  }

    const cg = ctx.createGain(); cg.gain.value = 0; corpo.connect(cg); cg.connect(g); corpo.start(); extra.push(corpo);     // tono a 130 Hz tolto: suonava come un soffio in una bottiglia

    stop() { const t = ctx.currentTime; g.gain.setTargetAtTime(0, t, 0.03); n.stop(t + 0.5); extra.forEach(x => x.stop(t + 0.5)); },

function suonoAggancio(ctx, out0, t, perfetto) {   // aggancio normale: Monolito + sfiato. Perfetto: inizio del Monolito, poi Accordo con lo sfiato sotto
  const out = ctx.createGain(); out.connect(out0);
  if (!perfetto) {
    out.gain.value = 0.85;
    nota(ctx, out, t, 46, 'sine', 0.004, 0.45, 0.8, 0, 78);
    massa20(ctx, out, t, 140, 0.003, 0.30, 0.7);
    nota(ctx, out, t, 55, 'sine', 0.12, 0.9, 0.25);
    nota(ctx, out, t, 82.5, 'sine', 0.15, 0.8, 0.18);
    nota(ctx, out, t, 110, 'triangle', 0.18, 0.7, 0.12, 400);
    const ts = t + 0.60;                                  // lo sfiato entra quando il colpo e' quasi spento: due momenti distinti
    const h = ctx.createBufferSource(); h.buffer = rumore(ctx, 2);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.6;
    bp.frequency.setValueAtTime(1800, ts); bp.frequency.exponentialRampToValueAtTime(700, ts + 1.1);
    h.connect(bp); bp.connect(env20(ctx, out, ts, 0.06, 0.55, 0.16)); h.start(ts); h.stop(ts + 2.0);
  } else {
    out.gain.value = 0.9;
    nota(ctx, out, t, 46, 'sine', 0.004, 0.45, 0.8, 0, 78);
    massa20(ctx, out, t, 140, 0.003, 0.30, 0.7);
    const ta = t + 0.30;
    const bus = ctx.createGain(); bus.connect(out);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.6; lp.connect(bus);
    lp.frequency.setValueAtTime(300, ta); lp.frequency.linearRampToValueAtTime(750, ta + 0.3); lp.frequency.linearRampToValueAtTime(260, ta + 1.6);
    [73.4, 110, 146.8, 220].forEach((f, i) => { [-4, 4].forEach(c => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = c; o.connect(env20(ctx, lp, ta, 0.30, 0.9, 0.18 / (1 + i * 0.35))); o.start(ta); o.stop(ta + 3.6); }); });
    const ts = t + 0.60;                                  // lo sfiato di sempre, sotto l'Accordo
    const h = ctx.createBufferSource(); h.buffer = rumore(ctx, 2);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.6;
    bp.frequency.setValueAtTime(1800, ts); bp.frequency.exponentialRampToValueAtTime(700, ts + 1.1);
    h.connect(bp); bp.connect(env20(ctx, out, ts, 0.06, 0.55, 0.16)); h.start(ts); h.stop(ts + 2.0);
  }
}

// Sottofondo del gioco: il "rombo di scafo" (lo stesso suono che si sentiva sotto il menu, scelto dall'utente): rumore e onda a ~40 Hz, filtrati,
// con il volume che pulsa a 13 Hz (vibrazione dello scafo). Solo durante il tentativo; il menu e' silenzioso.
// set(tensione 0..1): con poca integrita' o poco carburante la vibrazione si intensifica, il rombo si schiarisce un po' e sale di livello.
function suonoSottofondo(ctx, out) {
  const base = 0.34;                                                             // stesso livello con cui si sentiva sotto il menu
  const uscita = ctx.createGain(); uscita.gain.value = 0.0001; uscita.connect(out);
  const g = ctx.createGain(); g.gain.value = 0; g.connect(uscita);
  const n = ctx.createBufferSource(); n.buffer = rumore(ctx); n.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160; lp.Q.value = 0.8; n.connect(lp); lp.connect(g);
  const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 40;
  const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 150; const og = ctx.createGain(); og.gain.value = 0.45;
  o.connect(lp2); lp2.connect(og); og.connect(g);
  const lfo = ctx.createOscillator(); lfo.frequency.value = 13; const lg = ctx.createGain(); lg.gain.value = 0.07; lfo.connect(lg); lg.connect(g.gain);
  n.start(); o.start(); lfo.start();
  uscita.gain.setTargetAtTime(base, ctx.currentTime, 0.8);                      // entra piano
  return {
    set(t) { const k = ctx.currentTime; lp.frequency.setTargetAtTime(160 + 120 * t, k, 0.5); lg.gain.setTargetAtTime(0.07 * (1 + t), k, 0.5); uscita.gain.setTargetAtTime(base * (1 + 0.8 * t), k, 0.5); },
    stop() { const k = ctx.currentTime; uscita.gain.setTargetAtTime(0, k, 0.3); [n, o, lfo].forEach(x => { try { x.stop(k + 1.5); } catch (e) {} }); },
  };
}
const SND = { ctx: null, master: null, loopBus: null, motor: null, jets: null, amb: null, tens: -1 };
function sndCatena(ctx) {                              // uscita: suoni -> (secco + armoniche dei bassi) -> compressore -> altoparlanti
  const master = ctx.createGain(); master.gain.value = 1.4;
  const loops = ctx.createGain(); loops.gain.value = 0.486; loops.connect(master);          // motore e getti: sotto agli altri suoni
  const mix = ctx.createGain(); master.connect(mix);
  // Gli altoparlanti dei portatili non riproducono sotto ~100 Hz: aggiungo le armoniche dei bassi (saturazione) cosi' il peso si sente lo stesso.
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 80; bp.Q.value = 0.6;
  const ws = ctx.createWaveShaper(), cv = new Float32Array(2048); for (let k = 0; k < 2048; k++) cv[k] = Math.tanh(4 * (k / 1023.5 - 1)) / 4;
  ws.curve = cv; const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 110; const eg = ctx.createGain(); eg.gain.value = 1.2;
  master.connect(bp); bp.connect(ws); ws.connect(hp); hp.connect(eg); eg.connect(mix);
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -3; comp.knee.value = 3; comp.ratio.value = 8; comp.attack.value = 0.002; comp.release.value = 0.15;     // solo da limitatore: non amplifica i suoni piu' piani
  mix.connect(comp); return { master, loops, uscita: comp };
}
function sndInit() {                                   // va chiamata da un gesto dell'utente (tasto): i browser non fanno partire l'audio prima
  if (!SND.ctx) {
    SND.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const c = sndCatena(SND.ctx); SND.master = c.master; SND.loopBus = c.loops; c.uscita.connect(SND.ctx.destination);
  }
  if (SND.ctx.state === 'suspended') SND.ctx.resume();
  if (!SND.pronto) { SND.pronto = true; [1, 2, 3, 4].forEach(s => { rumore(SND.ctx, s); rumoreBruno(SND.ctx, s); }); }       // buffer pronti prima che servano: niente scatti agli urti e alla distruzione
}
function sndStopLoops() {
  if (SND.motor) { SND.motor.stop(); SND.motor = null; }
  if (SND.jets) { SND.jets.stop(); SND.jets = null; }
  if (SND.amb) { SND.amb.stop(); SND.amb = null; SND.tens = -1; }
}
function toggleSound() {
  opts.sound = !opts.sound;
  if (opts.sound) { sndInit(); suonoUrto(SND.ctx, SND.master, SND.ctx.currentTime + 0.02, 0.2); } else sndStopLoops();
}
function sndPlay(fn, ritardo, guadagno) {              // suono breve: funzione (ctx, uscita, istante); guadagno: ritocco di volume
  if (!opts.sound || !SND.ctx) return;
  try { let o = SND.master; if (guadagno) { o = SND.ctx.createGain(); o.gain.value = guadagno; o.connect(SND.master); }
    fn(SND.ctx, o, SND.ctx.currentTime + 0.01 + (ritardo || 0)); } catch (e) { /* un errore audio non deve mai fermare il gioco */ }
}
function sndImpact(danno) {                            // gravita' dall'entita' del danno: lieve, medio, forte
  const i = danno < 8 ? 0.2 : danno < 20 ? 0.55 : 1;
  sndPlay((c, o, t) => suonoUrto(c, o, t, i), 0, 1.4);                  // un po' piu' forte: gli urti non devono perdersi sotto al motore
}
function sndUpdate() {                                 // ogni fotogramma: motore e getti seguono i propulsori accesi
  if (!opts.sound || !SND.ctx) return;
  try {
    const f = S.fl, run = mode === 'run';
    if (!SND.motor) SND.motor = suonoMotore(SND.ctx, SND.loopBus);
    if (!SND.jets) { const jb = SND.ctx.createGain(); jb.gain.value = 1.02; jb.connect(SND.loopBus); SND.jets = suonoGetti(SND.ctx, jb, 'soffice'); }
    if (run && !SND.amb) { SND.amb = suonoSottofondo(SND.ctx, SND.master); SND.tens = -1; }       // il sottofondo c'e' solo durante il tentativo
    if (!run && SND.amb) { SND.amb.stop(); SND.amb = null; }
    if (SND.amb) {                                                                              // tensione: poca integrita' o poco carburante
      const ten = Math.max(clamp((100 - S.hull) / 70, 0, 1), clamp((0.4 - S.fuel / P.fuel) / 0.4, 0, 1));
      if (Math.abs(ten - SND.tens) > 0.02) { SND.tens = ten; SND.amb.set(ten); }
    }
    SND.motor.set(run ? f.main : 0);
    SND.jets.set(run ? Math.max(f.rev, f.latL, f.latR, f.rotL, f.rotR) : 0);
  } catch (e) { /* idem */ }
}

// ---------------------------------------------------------------------------
// Fisica
// ---------------------------------------------------------------------------
function damage(amount, why) {
  if (amount <= 0) return;
  S.hull -= amount; S.dmg += amount; S.flash = 1;
  banner = { text: `${why}  (-${Math.round(amount)}% integrità)`, t: 4, col: COL.bad };
  if (S.hull <= 0) finish('destroyed');
  else sndImpact(amount);
}

// Allarmi: da quando si arriva al limite (scafo <= 30%, carburante <= 20%) il suono si ripete ogni secondo, e nello stesso istante lampeggia la voce
// critica nel pannello (anche con i suoni spenti). Se sono critici entrambi, sono sfasati di mezzo secondo per non coprirsi.
function aggiornaAllarmi() {
  // Sotto il 10% (scafo <= 10%, carburante <= 10%) la frequenza raddoppia (ogni mezzo secondo) e, se silenziati, gli allarmi tornano attivi
  // una volta sola, al momento di entrare in quella zona; si possono silenziare di nuovo con gli stessi tasti.
  const scafo = S.hull <= 30 && S.hull > 0, carb = S.fuel <= P.fuel * 0.2;
  const scafo2 = S.hull <= 10 && S.hull > 0, carb2 = S.fuel <= P.fuel * 0.1;
  if (scafo2 && !S.crit2Hull) { S.crit2Hull = true; S.muteHull = false; S.nextHull = S.t; }                 // entra nella zona: riattivo e suono subito
  if (carb2 && !S.crit2Fuel) { S.crit2Fuel = true; S.muteFuel = false; S.nextFuel = S.t; }
  const dH = scafo2 ? 0.5 : 1, dF = carb2 ? 0.5 : 1;
  if (scafo) {
    if (S.t >= S.nextHull) { S.nextHull = (S.nextHull > S.t - dH ? S.nextHull : S.t) + dH; S.blinkHull = S.t; if (!S.muteHull) sndPlay((c, o, t) => suonoAllarme(c, o, t, 'integrita')); }
  } else S.nextHull = S.t;
  if (carb) {
    if (S.nextFuel === 0 || S.nextFuel < 0) S.nextFuel = scafo ? S.nextHull + dH / 2 : S.t;       // sfasati di meta' periodo per non coprirsi
    if (S.t >= S.nextFuel) { S.nextFuel = (S.nextFuel > S.t - dF ? S.nextFuel : S.t) + dF; S.blinkFuel = S.t; if (!S.muteFuel) sndPlay((c, o, t) => suonoAllarme(c, o, t, 'carburante')); }
  } else S.nextFuel = 0;
}
function step(dt) {
  if (mode === 'help') return;                    // guida aperta: tutto fermo
  S.clock += dt;
  if (S.boom) aggiornaEsplosione(dt);
  if (mode === 'done' && S.dock) { settleDock(); return; }      // agganciata: la nave segue la stazione
  if (mode !== 'run') return;
  S.t += dt;
  S.aidTime[aids] += dt;
  aggiornaBersaglio();

  const k = down('ShiftLeft', 'ShiftRight') ? P.fine : 1;
  const hx = Math.cos(S.th), hy = Math.sin(S.th);
  let ax = 0, ay = 0, tq = 0;
  const f = S.fl;
  f.main = f.rev = f.latL = f.latR = f.rotL = f.rotR = 0;
  const hasFuel = S.fuel > 0;

  // ingaggio: c'e' almeno un tasto di guida premuto in questo istante?
  if (CONTROLS.some(c => keys[c])) {
    S.active += dt;
    if (S.firstInput === null) S.firstInput = S.t;
    S.maxIdle = Math.max(S.maxIdle, S.idle); S.idle = 0;
  } else {
    S.idle += dt;
  }

  if (hasFuel) {
    if (down('KeyW', 'ArrowUp'))   { ax += hx * P.main * k; ay += hy * P.main * k; S.fuel -= P.useMain * k * dt; f.main = k; }
    if (down('KeyS', 'ArrowDown')) { ax -= hx * P.reverse * k; ay -= hy * P.reverse * k; S.fuel -= P.useRev * k * dt; f.rev = k; }
    if (opts.lateral) {
      if (down('KeyQ')) { ax += -hy * P.lateral * k; ay += hx * P.lateral * k; S.fuel -= P.useLat * k * dt; f.latL = k; }
      if (down('KeyE')) { ax -= -hy * P.lateral * k; ay -= hx * P.lateral * k; S.fuel -= P.useLat * k * dt; f.latR = k; }
    }
    if (down('KeyA', 'ArrowLeft'))  { tq += P.torque * k; S.fuel -= P.useRot * k * dt; f.rotL = k; }
    if (down('KeyD', 'ArrowRight')) { tq -= P.torque * k; S.fuel -= P.useRot * k * dt; f.rotR = k; }
  }
  if (S.fuel < 0) S.fuel = 0;
  aggiornaAllarmi();

  if (tq === 0 && opts.assist && hasFuel) {      // assistente: mantiene l'assetto relativo alla stazione
    const diff = S.ws - S.w;
    const dw = Math.sign(diff) * Math.min(Math.abs(diff), P.assistTorque * dt);
    S.w += dw;
    if (Math.abs(diff) > 0.002) S.fuel -= P.useRot * 0.3 * dt;
  }
  S.w = clamp(S.w + tq * dt, -P.wMax, P.wMax);
  S.th += S.w * dt;
  S.vx += ax * dt; S.vy += ay * dt;
  S.x += S.vx * dt; S.y += S.vy * dt;

  collide();
  checkDock();
  if (mode === 'run') {
    const d = Math.hypot(S.x, S.y);
    if (d > 600 || (S.fuel <= 0 && d > 450)) finish('drift');
  }
}

// Dopo l'aggancio la nave diventa solidale con la stazione: in circa un secondo si porta con delicatezza
// nella posizione ideale (perpendicolare al portellone, muso inserito di 0,8 m) e poi ne segue il moto.
function settleDock() {
  const d = S.dock, p = portAt(S.clock, d.i);
  const k = clamp((S.clock - d.t0) / 1.4, 0, 1), e = k * k * (3 - 2 * k);       // andamento dolce
  const a = d.a + (SHIP.punta - 0.8 - d.a) * e;
  const l = d.l * (1 - e);
  S.x = p.px + p.nx * a + p.tx * l; S.y = p.py + p.ny * a + p.ty * l;
  S.th = p.psi + Math.PI + d.e * (1 - e);
  S.vx = p.vx; S.vy = p.vy; S.w = S.ws;
  const f = S.fl; f.main = f.rev = f.latL = f.latR = f.rotL = f.rotR = 0;
}

function collide() {
  const st = stationShapes(S.clock);
  const risolvi = (c, parte) => {                    // c: { d, nx, ny } con la normale dalla stazione verso la nave
    S.x += c.nx * c.d; S.y += c.ny * c.d;
    let q = parte[0], m = Infinity;                  // punto di contatto: il vertice della nave piu' dentro l'ostacolo
    for (const v of parte) { const dd = (v[0] + c.nx * c.d) * c.nx + (v[1] + c.ny * c.d) * c.ny; if (dd < m) { m = dd; q = v; } }
    const qx = q[0] + c.nx * c.d, qy = q[1] + c.ny * c.d;
    const vn = (S.vx + S.ws * qy) * c.nx + (S.vy - S.ws * qx) * c.ny;           // velocita' relativa alla stazione, lungo la normale
    if (vn < 0) {
      S.vx -= 1.3 * vn * c.nx; S.vy -= 1.3 * vn * c.ny;
      if (-vn > 0.4) S.hits++;
      else if (-vn > 0.2) sndPlay((cx, o, t) => suonoUrto(cx, o, t, 0.2));        // sfioramento: nessun danno, solo un tocco
      damage(Math.max(0, -vn - 0.4) * 8, 'Urto con la stazione');
    }
  };
  for (const o of st.polys.concat(st.cerchi)) {
    if (mode !== 'run') return;
    const parti = shipWorld();
    for (const parte of parti) {
      const c = o.pts ? satPolyPoly(parte, o.pts) : satPolyCirc(parte, o.x, o.y, o.r);
      if (c) { risolvi(c, parte); break; }           // dopo uno spostamento le altre parti si ricalcolano nel giro successivo
    }
  }
}

function checkDock() {
  const T = telemetry();
  if (S.prevA > 0 && T.a <= 0 && Math.abs(T.l) < T.p.mezza) {                          // la punta attraversa il piano del porto, dentro la bocca
    const m = [T.closing / P.maxClose, T.lat / P.maxLat, Math.abs(T.err) / P.maxAng, Math.abs(T.rot) / P.maxRot];
    S.contact = { v: [T.closing, T.lat, Math.abs(T.err), Math.abs(T.rot)], m };      // valori al contatto e rapporto col limite
    const limL = T.p.mezza - SHIP.anelloMezzo, fuori = Math.abs(T.l) > limL;            // l'anello, non solo la punta, deve passare nella finestra
    if (m.every(v => v <= 1) && !fuori) {
      S.pt = T.p.i;
      S.dock = { i: T.p.i, t0: S.clock, a: (S.x - T.p.px) * T.p.nx + (S.y - T.p.py) * T.p.ny, l: (S.x - T.p.px) * T.p.tx + (S.y - T.p.py) * T.p.ty,
                 e: angDiff(S.th, T.p.psi + Math.PI) };       // posizione e angolo nel sistema del portellone
      finish('docked', m.every(v => v <= P.perfectFrac));
      return;
    }
    const names = ['velocità di avvicinamento', 'scivolamento', 'allineamento', 'rotazione'];
    const bad = names.filter((_, i) => m[i] > 1);
    if (fuori) bad.push('centratura (anello fuori dalla finestra)');
    if (m[0] > 1) S.failClose++;
    if (m[1] > 1) S.failLat++;
    if (m[2] > 1) S.failAng++;
    if (m[3] > 1) S.failRot++;
    const excess = m.reduce((s, v) => s + Math.max(0, v - 1), 0) + (fuori ? Math.abs(T.l) / limL - 1 : 0);
    const p = T.p;
    S.vx = p.vx + p.nx * (0.5 + 0.3 * Math.max(0, T.closing));
    S.vy = p.vy + p.ny * (0.5 + 0.3 * Math.max(0, T.closing));
    S.x += p.nx * (0.3 - T.a); S.y += p.ny * (0.3 - T.a);
    S.prevA = 0.3;
    S.bounces++;
    damage(Math.min(45, 10 + 15 * excess), 'Aggancio fallito: ' + bad.join(', ') + ' fuori tolleranza');
    return;
  }
  S.prevA = T.a;
}

// Esplosione: la nave scompare e si spezza nelle sue parti (sagome di SHIP.parti), con scintille, lampo e onda d'urto; tutto in coordinate di mondo.
// Cosi' non resta una nave "fantasma" ferma mentre la stazione le ruota addosso.
function creaEsplosione() {
  const hx = Math.cos(S.th), hy = Math.sin(S.th), rx = Math.sin(S.th), ry = -Math.cos(S.th);
  const frammenti = SHIP.parti.map(parte => {
    const pts = parte.pts, c = centroide(pts), wx = S.x + c[0] * hx + c[1] * rx, wy = S.y + c[0] * hy + c[1] * ry;
    const ang = Math.atan2(wy - S.y, wx - S.x) + (Math.random() - 0.5) * 1.2, sp = 1.5 + Math.random() * 3.5;
    return { pts, c, x: wx, y: wy, vx: S.vx + Math.cos(ang) * sp, vy: S.vy + Math.sin(ang) * sp, th: S.th, w: (Math.random() - 0.5) * 3 };
  });
  const scintille = Array.from({ length: 70 }, () => { const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 8;
    return { vx: S.vx + Math.cos(a) * sp, vy: S.vy + Math.sin(a) * sp, vita: 0.7 + Math.random() * 1.6, r: 0.08 + Math.random() * 0.18 }; });
  return { t0: S.clock, x: S.x, y: S.y, vx: S.vx, vy: S.vy, frammenti, scintille };
}
function aggiornaEsplosione(dt) {                      // chiamata a ogni passo di fisica: i frammenti volano, ruotano e rimbalzano sulla stazione
  const B = S.boom;                                                                // i frammenti non si dissolvono: continuano a driftare nello spazio (finche' dura la schermata)
  const st = stationShapes(S.clock), ostacoli = st.polys.concat(st.cerchi);
  for (const f of B.frammenti) {
    f.x += f.vx * dt; f.y += f.vy * dt; f.th += f.w * dt;
    const hx = Math.cos(f.th), hy = Math.sin(f.th), rx = Math.sin(f.th), ry = -Math.cos(f.th);
    const poly = f.pts.map(([x, y]) => { const dx = x - f.c[0], dy = y - f.c[1]; return [f.x + dx * hx + dy * rx, f.y + dx * hy + dy * ry]; });
    for (const o of ostacoli) {
      const c = o.pts ? satPolyPoly(poly, o.pts) : satPolyCirc(poly, o.x, o.y, o.r);
      if (!c) continue;
      f.x += c.nx * c.d; f.y += c.ny * c.d;

function updateCam(dt, snap) {
  const p = portAt(S.clock);
  const mx = (S.x + p.px) / 2, my = (S.y + p.py) / 2;
  const dist = Math.hypot(S.x - p.px, S.y - p.py);
  const half = Math.max(28, dist * 0.6 + 14);
  const target = Math.max(0.2, 0.5 * Math.min(W - PANEL, H) / half);      // mai negativo, anche con finestre molto strette
  if (snap) { cam.x = mx; cam.y = my; cam.s = target; return; }

  cam.x += (mx - cam.x) * f; cam.y += (my - cam.y) * f;
  cam.s *= Math.pow(target / cam.s, f);
}
const sx = x => (W - PANEL) / 2 + (x - cam.x) * cam.s;

    ctx.beginPath(); ctx.moveTo(x + nx * w * 0.45, y + ny * w * 0.45); ctx.lineTo(x + dx * L * 0.6, y + dy * L * 0.6); ctx.lineTo(x - nx * w * 0.45, y - ny * w * 0.45); ctx.fill();
  };
  const F = ug.front, R = ug.rear, FY = ug.fy, LX = ug.lat, LY = ug.ly;           // posizioni degli ugelli dalla scheda della nave
  if (f.rev) { jet(F, FY, 1, 0, f.rev); jet(F, -FY, 1, 0, f.rev); }                // frenata: getti in avanti
  if (f.latL) jet(LX, LY, 0, 1, f.latL);                                           // Q spinge a sinistra: getto a destra
  if (f.latR) jet(LX, -LY, 0, -1, f.latR);                                         // E spinge a destra: getto a sinistra
  if (f.rotL) { jet(F, FY, 0, 1, f.rotL); jet(R, -FY, 0, -1, f.rotL); }            // A: il muso va a sinistra, la coda a destra
  if (f.rotR) { jet(F, -FY, 0, -1, f.rotR); jet(R, FY, 0, 1, f.rotR); }            // D: il contrario
  // Scafo: le STESSE forme usate per le collisioni (SHIP.parti). Linee e finestrini sono decorazioni interne.
  const flash = S.flash > 0, lw = Math.min(2.2, Math.max(1.2, sc * 0.1)) / sc;      // contorno sottile: 1,2-2,2 pixel a qualsiasi zoom
  const fill = flash ? '#ff8a8a' : '#10202e', edge = flash ? COL.bad : COL.ship;
  const disegna = parte => {
    const pan = parte.stile === 'pannello';
    ctx.fillStyle = pan ? '#0b1722' : fill; ctx.strokeStyle = pan ? '#4f7e9c' : edge; ctx.lineWidth = pan ? lw * 0.7 : lw;
    ctx.beginPath(); parte.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); ctx.stroke();
  };
  SHIP.parti.slice(0, 2).forEach(disegna);                                         // pannelli radiatori
  ctx.strokeStyle = '#3b5f78'; ctx.lineWidth = lw * 0.6; ctx.beginPath();
  for (const x of [-2.5, -1.0, 0.2]) { ctx.moveTo(x * 0.65, 1.15 * 0.95); ctx.lineTo(x * 0.65, 1.45 * 0.95); ctx.moveTo(x * 0.65, -1.15 * 0.95); ctx.lineTo(x * 0.65, -1.45 * 0.95); } ctx.stroke();   // tiranti
  SHIP.parti.slice(2).forEach(disegna);                                            // campana, scafo, anello, sonda
  ctx.strokeStyle = '#3b5f78'; ctx.lineWidth = lw * 0.6; ctx.beginPath();
  for (const x of [-2.6, -1.2, 0.3, 1.6]) { ctx.moveTo(x * 0.65, -1.15 * 0.95); ctx.lineTo(x * 0.65, 1.15 * 0.95); } ctx.stroke();       // giunti dei pannelli
  ctx.fillStyle = COL.ship; for (const y of [-0.75, -0.14, 0.47]) ctx.fillRect(2.05 * 0.65, y * 0.95, 0.35 * 0.65, 0.28 * 0.95);          // oblo'
  ctx.restore();
}

function drawPrediction() {
  // Proiezione della posizione della nave RISPETTO AL PORTELLO: dove sara' la nave fra 1..12 s (se non spinge piu') vista dal sistema di riferimento della stazione.
  // Nel sistema della stazione i portelli stanno fermi: la nave e' sul portello quando i puntini ci arrivano. Si ottiene portando la posizione futura
  // assoluta (posizione + velocita' per il tempo) indietro di quanto la stazione ruota in quel tempo, intorno al centro del mozzo.
  ctx.font = '11px ui-monospace, Menlo, monospace'; ctx.textAlign = 'left';
  for (let k = 1; k <= 12; k++) {
    const fx = S.x + S.vx * k, fy = S.y + S.vy * k, a = -S.ws * k, c = Math.cos(a), s = Math.sin(a);
    const rx = fx * c - fy * s, ry = fx * s + fy * c;
    ctx.fillStyle = COL.ship; ctx.globalAlpha = 0.85;
    ctx.fillRect(sx(rx) - 1.5, sy(ry) - 1.5, 3, 3);
    ctx.globalAlpha = 1;
    if (k % 4 === 0) { ctx.fillStyle = COL.ship; ctx.fillText(k + 's', sx(rx) + 5, sy(ry) - 5); }
  }
}

function level(v, max) { return v <= max ? COL.good : v <= 1.5 * max ? COL.warn : COL.bad; }

function bar(x, y, w, frac, col) {
  ctx.fillStyle = '#16202b'; ctx.fillRect(x, y, w, 6);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * clamp(frac, 0, 1), 6);
}

function row(label, valStr, v, max, y) {
  const x = W - PANEL + 16, w = PANEL - 32, col = level(v, max);
  text(label, x, y, COL.dim, 12);
  text(valStr, x + w, y, col, 14, 'right');
  ctx.fillStyle = '#16202b'; ctx.fillRect(x, y + 6, w, 5);
  ctx.fillStyle = col; ctx.fillRect(x, y + 6, w * clamp(v / (2 * max), 0, 1), 5);
  ctx.fillStyle = COL.txt; ctx.fillRect(x + w / 2 - 1, y + 3, 2, 11);       // limite di tolleranza
}

function fitText(str, x, y, maxW, col, size) {          // rimpicciolisce il testo finche' entra in maxW
  let sz = size;
  ctx.font = `${sz}px ui-monospace, Menlo, Consolas, monospace`;
  const w = ctx.measureText(str).width;
  if (w > maxW) sz = Math.max(8, Math.floor(size * maxW / w * 10) / 10);
  text(str, x, y, col, sz);
}

function overlay(lines, title, tcol) {
  // lines: [testo, colore] | [testo, colore, {center:true}] | [null, null, {opt:{n,label,values,sel}}]
  // Il riquadro si adatta alla riga piu' lunga; se non entra nello schermo il testo si rimpicciolisce.
  const avail = W - PANEL - 20, pad = 36;
  const font = (sz, bold) => `${bold ? 'bold ' : ''}${sz}px ui-monospace, Menlo, Consolas, monospace`;
  const optRows = lines.filter(l => l[2] && l[2].opt).map(l => l[2].opt);
  const measure = sz => {
    ctx.font = font(sz);
    const labW = Math.max(0, ...optRows.map(o => ctx.measureText(o.n + '   ' + o.label).width));
    let w = 360;
    for (const l of lines) {
      if (l[2] && l[2].opt) {
        const chips = l[2].opt.values.reduce((a, v) => a + ctx.measureText(v).width + 14 + 6, 0);
        w = Math.max(w, labW + 32 + chips);
      } else w = Math.max(w, ctx.measureText(l[0]).width);
    }
    return { w, labW };
  };
  let size = 14;
  const need = measure(size).w;
  if (need + pad * 2 > avail) size = Math.max(9, Math.floor(size * (avail - pad * 2) / need * 10) / 10);
  size = Math.max(9, Math.min(size, (H - 120) / (lines.length * 1.7)));          // e che entri in altezza
  const m = measure(size);
  const bw = Math.min(avail, m.w + pad * 2);
  const lh = Math.round(size * 1.7), bh = 90 + lines.length * lh;
  const bx = (W - PANEL - bw) / 2, by = Math.max(10, H - bh - 24);
  ctx.fillStyle = 'rgba(5,9,15,0.92)'; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = tcol; ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, bw, bh);
  text(title, bx + bw / 2, by + 42, tcol, 22, 'center');
  lines.forEach((l, i) => {
    const y = by + 82 + i * lh, ex = l[2] || {};
    if (ex.opt) {                                         // riga-opzione: etichetta + valori; quello scelto e' evidenziato
      const o = ex.opt;
      text(o.n, bx + pad, y, COL.ship, size);
      text(o.label, bx + pad + ctx.measureText(o.n + '   ').width, y, COL.txt, size);
      let cx = bx + pad + m.labW + 32;
      o.values.forEach((v, k) => {
        ctx.font = font(size);
        const cw = ctx.measureText(v).width + 14;
        if (k === o.sel) {
          ctx.fillStyle = COL.ship; ctx.fillRect(cx, y - size * 1.05, cw, size * 1.5);
          ctx.font = font(size, true); ctx.fillStyle = '#05070d'; ctx.textAlign = 'center';
          ctx.fillText(v.toUpperCase(), cx + cw / 2, y);
        } else text(v, cx + cw / 2, y, COL.dim, size, 'center');
        cx += cw + 6;
      });
    } else if (ex.center) text(l[0], bx + bw / 2, y, l[1] || COL.txt, size, 'center');
    else text(l[0], bx + pad, y, l[1] || COL.txt, size);
  });
}

        [`Propellente           +${r.fuelBonus}   ${P.fuelRate} punti per ogni unità rimasta (${S.fuel.toFixed(0)})`, T_],
        [`Aggancio perfetto     +${r.perfectBonus}   +${P.perfectBonus} se tutti e 4 i parametri sono entro il ${Math.round(P.perfectFrac * 100)}% del limite`, r.perfect ? COL.good : T_],
        [`Danni                 -${r.dmgPenalty}   ${P.dmgRate} punti per ogni 1% di integrità persa (${Math.round(S.dmg)}%)`, r.dmgPenalty ? COL.bad : T_],
        [`TOTALE: ${r.score}`, COL.warn],
        ['', T_],
        ...tab,
        ['', T_],
        ['SPAZIO: torna al riepilogo     INVIO riprova     M menu', O_, { center: true }],
      ], 'DETTAGLI DEL PUNTEGGIO', COL.warn);
    } else if (r.kind === 'docked') {
      overlay([
        [`Tempo: ${S.t.toFixed(0)} s    Propellente rimasto: ${S.fuel.toFixed(0)}    Integrità scafo: ${Math.max(0, Math.round(S.hull))}%`, T_],
        ['', T_],
        [riga('Base', '+' + P.scoreBase), T_],
        [riga('Rapidità', '+' + r.speedBonus), T_],
        [riga('Propellente', '+' + r.fuelBonus), T_],
        [riga('Aggancio perfetto', '+' + r.perfectBonus), r.perfect ? COL.good : COL.dim],
        [riga('Penalità per i danni', '-' + r.dmgPenalty), r.dmgPenalty ? COL.bad : COL.dim],
        [`PUNTEGGIO: ${r.score}`, COL.warn],
        ...(r.newRecord ? [['CONGRATULAZIONI! HAI STABILITO IL NUOVO PUNTEGGIO MASSIMO', COL.good, { center: true }]]
          : recordGlobale !== null ? [[`Il punteggio massimo è ${recordGlobale}`, D_, { center: true }]] : []),
        ['', T_],
        ['SPAZIO: come si calcola il punteggio', D_, { center: true }],
        ['INVIO riprova     M menu     H guida', O_, { center: true }],
      ], r.perfect ? 'AGGANCIO PERFETTO' : 'AGGANCIO RIUSCITO', COL.good);
    } else {
      overlay([
        [r.kind === 'destroyed' ? 'L\'integrità dello scafo è arrivata a 0%.' : 'Sei andato alla deriva.', T_],
        ['', T_],
        ['SPAZIO: dettagli dell\'ultimo contatto', D_, { center: true }],
        ['INVIO riprova     M menu     H guida', O_, { center: true }],
      ], r.kind === 'destroyed' ? 'NAVE DISTRUTTA' : 'ALLA DERIVA', COL.bad);
    }
  }
  if (banner && mode !== 'menu') {
    ctx.globalAlpha = clamp(banner.t, 0, 1);
    text(banner.text, (W - PANEL) / 2, 40, banner.col, 15, 'center');
    ctx.globalAlpha = 1;
  }
}

// Tasto C: sovrappone alla grafica i contorni di collisione (magenta). Serve a verificare che disegno e collisione coincidano.
let debugColl = false;
function drawDebug() {
  if (!debugColl) return;
  ctx.strokeStyle = '#ff2fd0'; ctx.lineWidth = 1; ctx.setLineDash([]);
  const poli = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y))); ctx.closePath(); ctx.stroke(); };
  for (const parte of shipWorld()) poli(parte);
  const st = stationShapes(S.clock);
  for (const o of st.polys) poli(o.pts);
  for (const c of st.cerchi) { ctx.beginPath(); ctx.arc(sx(c.x), sy(c.y), c.r * cam.s, 0, Math.PI * 2); ctx.stroke(); }
  const t = telemetry(); ctx.fillStyle = '#ff2fd0'; ctx.beginPath(); ctx.arc(sx(S.x + Math.cos(S.th) * SHIP.punta), sy(S.y + Math.sin(S.th) * SHIP.punta), 3, 0, 7); ctx.fill();
  PORTE.forEach((porta, i) => {                                                  // punto di aggancio di ogni porto e raggio a cui arriva l'alone
    const p = portAt(S.clock, i); let R = Infinity;
    for (const seg of segmentiAnello(p, porta.tipo)) R = Math.min(R, distPuntoSegmento(p.px, p.py, seg[0][0], seg[0][1], seg[1][0], seg[1][1]));
    ctx.beginPath(); ctx.moveTo(sx(p.px) - 6, sy(p.py)); ctx.lineTo(sx(p.px) + 6, sy(p.py)); ctx.moveTo(sx(p.px), sy(p.py) - 6); ctx.lineTo(sx(p.px), sy(p.py) + 6); ctx.stroke();
    ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(sx(p.px), sy(p.py), R * cam.s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  });
  text('contorni di collisione (C)', 12, H - 44, '#ff2fd0', 11);
}
function render() {
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W - PANEL, H); ctx.clip();
  // livelli: 0 completo, 1 essenziale (cono + mira), 2 nullo (solo il pannello)
  drawStars();
  if (aids <= 1) drawGuidance(aids === 0);
  drawStation();
  if (aids === 0) drawPrediction();
  drawShip(aids <= 1);
  drawDebug();
  ctx.restore();
  text('Space Trucker prototipo docking  v' + VERSION, 12, H - 12, 'rgba(160,180,200,0.55)', 11);
  if (mode === 'run' && down('ShiftLeft', 'ShiftRight')) text('CONTROLLO FINE  30%', (W - PANEL) / 2, 70, COL.warn, 14, 'center');
  if (logNote.t > 0) text(logNote.text, 12, H - 28, 'rgba(107,255,154,' + Math.min(1, logNote.t) * 0.8 + ')', 11);
  drawHud(); drawOverlays();
}

// ---------------------------------------------------------------------------
// Ciclo principale (passo fisico fisso a 120 Hz)
// ---------------------------------------------------------------------------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  const h = 1 / 120;
  while (acc >= h) { step(h); acc -= h; }
  if (S.flash > 0) S.flash -= dt * 2;
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (logNote.t > 0) logNote.t -= dt;
  updateCam(dt, false);
  sndUpdate();
  render();
  requestAnimationFrame(frame);
}
newRun();
logEvent('visit', {
  browser: browserName(), touch: navigator.maxTouchPoints > 0,
  screen: screen.width + 'x' + screen.height, viewport: innerWidth + 'x' + innerHeight,
  lang: navigator.language, ref: document.referrer ? new URL(document.referrer).hostname : '',
});
caricaRecord();
requestAnimationFrame(frame);
</script>
