#  --- STRUTTURA ----------------------------------------------------------------------------
#  APERTURA -> MENU (ETICHETTA: menu) con sei scelte, ognuna porta a un modulo:
#     tempo      -> modulo TEMPO, poi torna al menu
#     comandi    -> modulo COMANDI (manovra: rotazione, stabilizzatore, flip e partenza), poi torna al menu
#     arrivo     -> il capo fa la partenza e tu fai la lezione di ARRIVO alla Luna, poi FINALE
#     basic      -> giro dell'interfaccia, poi torna al menu
#     tutorial   -> tutto in fila: TEMPO, COMANDI, CROCIERA, ARRIVO, FINALE   (si ricorda con l'etichetta "completo")
#     esperto    -> il capo ti lascia i comandi: il tutorial finisce subito
#
#  --- DIALOGO ------------------------------------------------------------------------------
#  CAPO: testo               il capo parla. Ogni battuta del capo aspetta INVIO (la riga INVIO non serve piu' e viene ignorata)
#  TU: testo                 una battuta del giocatore (passa da sola dopo un secondo)
#  QUALSIASINOME: testo      un altro personaggio (per la storia futura): compare con il suo nome
#  CAPO: prima || seconda    una battuta con varianti: la prima volta dice "prima", se la ripete in un altro punto del copione dice "seconda" (e cosi' via).
#                            Il capo si ricorda di averla gia' detta quando la riga ha la STESSA prima variante. Si usa solo nelle battute (non negli ATTENDI e nei RIPETI).
#  Se dopo la battuta c'e' un ATTENDI (eventualmente con SBLOCCA / MARCA / RIPETI / TEMPO in mezzo) o una SCELTA, non serve INVIO: l'azione o la risposta partono appena la battuta e' scritta.
#  Le battute piu' lunghe di 2 righe nel riquadro hanno 2 secondi di lettura in piu' (solo quelle del giocatore e dei conti).
#
#  --- COMANDI E PANNELLO ---------------------------------------------------------------------
#  CONTO: 3                  battuta del capo che passa da sola dopo meno di un secondo (per i conti alla rovescia)
#  TENTATIVO                 conta una valutazione della spinta (si azzera con RIPARTI); condizione: tent>=4
#  RIPETI: 3 | frase | frase  durante il PROSSIMO ATTENDI il capo dice una frase ogni 3 secondi (in ordine casuale, senza INVIO, senza fermare niente); sostituisce gli aiuti a 20 secondi
#  RIPARTI                   rifa' la partenza: nuova nave sull'orbita di parcheggio, tempo 1, stabilizzatore acceso
#  RUOTA: FERMA              il capo contrasta la rotazione fino a fermare la nave (led nel centro)
#  RUOTA: SX 0.3             il capo da' un colpo di rotazione (SX = freccia sinistra, DX = freccia destra) per quel numero di secondi, come se premesse lui il tasto
#  SPINGI: eqCs>=175         il capo tiene premuta la spinta (↑) finche' la condizione diventa vera (al massimo 25 secondi); il copione aspetta
#  GIRA                      il capo preme il flip (barra spaziatrice) al posto tuo; per aspettare che finisca: ATTENDI: flip
#  SALVA: nome               ricorda la scena (nave, propellente, tempo) in questo punto
#  CARICA: nome              riporta la scena a come era al SALVA con quel nome (serve per riavvolgere e riprovare)
#  ORBITA: 1                 sceglie l'orbita di attracco obiettivo (1, 2, 3 oppure auto = la piu' vicina)
#  CORREGGI: 350 550         piccola correzione di rotta (costa un po' di propellente): il passaggio dalla Luna cade fra quelle due quote (km). Se non c'e' soluzione, non fa niente
#  AGGANCIA                  il computer di bordo aggancia la nave all'orbita obiettivo (solo se e' gia' legata alla Luna)
#  SBLOCCA: tempo            accende un comando e la sua parte di pannello. Valori: tempo (tutti i tasti), tempo1 (solo il 1), tempo3 (solo il 3), tempo01 (solo 0 e 1), spinta (freccia su / W), rot, stab, flip
#  BLOCCA: tempo            spegne di nuovo un comando gia' sbloccato (e la sua parte di pannello)
#  SPEGNI / ACCENDI          spegne (o riaccende) tutti i comandi e il pannello. Mentre e' spento i tasti non fanno niente
#  EVIDENZIA: tempo          tiene visibile una parte dell'interfaccia anche da spenta. EVIDENZIA: nulla le toglie tutte. Parti: tempo (i tasti), stab, rot (barra e led),
#                            prop (barra del propellente), tempi (tempo di gioco e di missione), dist (distanze), base (prop + tempi + dist insieme), spinta (arco della spinta), dati (il pannello dati)
#  TEMPO: 2                  imposta il tasto del tempo (0, 1, 2 o 3), come se lo premesse il capo (una riga TEMPO subito dopo una battuta parte mentre il capo sta ancora parlando)
#  STABILE                   riporta la nave stabile: tempo 1, stabilizzatore acceso, nessuna rotazione
#  PAUSA: 3                  aspetta 3 secondi (anche decimali, 1.5)
#  MARCA                     azzera il conteggio dei tasti del tempo premuti e di secAllin
#
#  --- ATTENDERE IL GIOCATORE -----------------------------------------------------------------

#      aspetta che "cond" diventi vero. Se il giocatore resta fermo 20 secondi il capo dice "aiuto 1", dopo
#      altri 20 "aiuto 2". "cond" e' una condizione (vedi sotto).

#  --- SCELTE DEL GIOCATORE (da 1 a 6 opzioni; si possono anche ripetere le stesse parole, per esempio "...") -----------------------------------------------------
#  SCELTA
#    OPZIONE [etichetta] Testo della risposta del giocatore

#    OPZIONE [altra] Un'altra risposta

#  FINE
#  [etichetta] e' facoltativa: se c'e', il gioco ricorda la scelta e piu' avanti si puo' reagire con SE etichetta.
#  IMPOSTA: etichetta        ricorda qualcosa senza che il giocatore scelga (etichetta a piacere, minuscola, senza spazi)
#
#  --- BATTUTE CHE DIPENDONO DA QUELLO CHE E' SUCCESSO -------------------------------------------
#  SE condizione
#    ...battute se vero...
#  ALTRIMENTI SE altra condizione
#    ...
#  ALTRIMENTI
#    ...battute se falso...
#  FINE

#  --- SALTI, TAPPE, FINE ----------------------------------------------------------------------
#  ETICHETTA: nome           un punto del copione a cui si puo' tornare (scritta fuori da ogni SE e SCELTA)
#  VAI: nome                 salta a quell'etichetta (anche da dentro un SE o una SCELTA)
#  TAPPA: nome               segna nei dati dei tester che il giocatore e' arrivato qui (e dopo quanti secondi)
#  CHIUDI: esito             chiude il tutorial. Gli esiti sono solo un nome per i dati: completato, esperto, saltato...
#
#  --- CONDIZIONI ----------------------------------------------------------------------------------
#  Si possono combinare con  E,  O,  NON   (NON lega piu' forte, poi E, poi O; niente parentesi).
#     es.:   SE cucina E NON aiutato        SE pranzo O capo        SE raKm>=9000 E legata
#  Un'etichetta (di una OPZIONE o di IMPOSTA) e' vera se il giocatore l'ha scelta.
#  Fatti vero/falso:
#     anticipo     all'ultimo ATTENDI il giocatore aveva gia' fatto la cosa prima che gliela chiedessero
#     aiutato      all'ultimo ATTENDI ha avuto bisogno dell'aiuto del capo
#     lento        all'ultimo ATTENDI ci ha messo piu' di 30 secondi

#     veloce       adesso il tempo e' sul tasto 2 o 3
#     spento       adesso i comandi sono spenti
#     centrato     il led della rotazione e' fermo nello zero (il "clic")
#     rotOk        ha gia' fatto ruotare la nave
#     inFin        la nave e' dentro la finestra di lancio     spingo   sta premendo la spinta     prua   la prua guarda nel senso del moto
#     inSOI        dentro la sfera d'influenza della Luna (dopo la partenza)
#     traiOk (spinta giusta, passaggio entro 25.000 km dalla Luna) traiPreciso (passaggio tra 100 e 3.500 km) traiSchianto traiPoca traiTroppa   com'e' la traiettoria prevista dopo la spinta
#     quotaOk      il passaggio previsto dalla Luna e' una quota buona per l'arrivo (100 - 650 km)
#     allontana    dentro la sfera d'influenza della Luna e in allontanamento (ha gia' passato il punto piu' vicino)
#     legata       la Luna tiene la nave (orbita chiusa)
#     orbitaOk     l'orbita attorno alla Luna combacia con quella obiettivo: fra poco la nave si aggancia
#     vicino       legata e quasi sull'orbita obiettivo (si accontenta il computer di bordo con AGGANCIA)
#     orbita       la nave e' stata agganciata all'orbita obiettivo
#     fallito      schianto, rientro o nave persa (la nave e' ferma: serve CARICA o RIPARTI)
#  Numeri (con  >=  <=  >  <  = ):
#     tAtt         secondi passati nell'ATTENDI in corso
#     secSu1       secondi consecutivi passati con il tempo sul 1
#     secAllin     secondi con la prua entro 15 gradi dalla direzione di moto (dove la terrebbe lo stabilizzatore); un'uscita sotto mezzo secondo si tollera; riparte da MARCA
#     ttFin / ttDs / ttMin  secondi reali / decimi di secondo reali (al tempo attuale) / minuti di gioco alla partenza della finestra di lancio
#     eqCs         spinta accumulata in centesimi di km/s (la barra: giusto tra 174 e 180)
#     periDs / periMin  decimi di secondo reali (al tempo attuale) / minuti di gioco al punto piu' vicino alla Luna (99999 se la traiettoria non lo ha)
#     quotaKm      quota prevista al punto piu' vicino (km)    altKm   quota attuale sulla Luna (km)
#     raKm / rpKm  quota massima / minima dell'orbita attorno alla Luna (km); raKm vale 99999 se la nave non e' legata
#     rotTocchi    quante volte ha premuto le frecce dopo l'ultima MARCA     vietati   quante volte ha premuto un tasto del gioco non ancora acceso
#     aiutiTot     quante volte il capo ha dovuto ripetere     tempo   il tasto del tempo in uso (0-3)     attesa   secondi dell'ultimo ATTENDI     tent   valutazioni della spinta
