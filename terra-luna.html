   Le funzioni di sintesi sono copiate da prototipi/docking/docking.js (suoni provati in strumenti/prove-suoni.html):

    ['Propellente rimasto ' + fmt(r.dvResiduo, 2) + ' km/s', T_], ['', T_]];
  if (rec.tempo) righe.push(['NUOVO RECORD DI TEMPO PER QUESTA ORBITA', COL.good, { center: true }]); if (rec.dv) righe.push(['NUOVO RECORD DI PROPELLENTE PER QUESTA ORBITA', COL.good, { center: true }]);
  if (ok && !rec.tempo && !rec.dv && rec.prima && rec.prima.n) righe.push(['Tentativi riusciti su questa orbita: ' + (rec.prima.n + 1), D_, { center: true }]);
  if (notaLog) righe.push([notaLog, D_, { center: true }]); righe.push(['', T_], ['INVIO riprova     H guida     N suoni', O_, { center: true }]);
  A.overlay(ctx, AW, H, righe, titoli[r.esito], ok ? COL.good : COL.bad, true);
}
function pannelloAvvio() {                                                                // guida iniziale: cosa fare e comandi (H la riapre, in pausa)
  const A = Aspetto, T_ = COL.txt, D_ = COL.dim, O_ = COL.port, N_ = COL.ship, R = ORB.map(q => { const r = recordOrbita(q.n); return '  ' + q.n.padEnd(26) + (r.n ? 'tempo ' + fmtT(r.tempo) + '    propellente ' + fmt(r.dv, 2) + ' km/s' : 'nessun tentativo riuscito'); });
  A.overlay(ctx, AW, H, [
    ['COSA DEVI FARE', O_],
    ['Porta la navetta Gabbiano dall\'orbita di parcheggio attorno alla Terra a un\'orbita di attracco attorno alla Luna, nel minor tempo e con il minor propellente possibile.', T_],
    ['  1  PARTENZA     la zona luminosa sull\'orbita indica dove partire. Quando la nave la raggiunge tieni premuto W finché la barra SPINTA ACCUMULATA entra nella zona verde.', D_],
    ['  2  CROCIERA     la linea tratteggiata è la tua traiettoria futura (con i tempi di arrivo). Deve passare vicino alla Luna, alla quota dell\'orbita scelta. Correggila con piccoli tocchi di W e ruotando con A / D.', D_],
    ['  3  ARRIVO       vicino alla Luna gira la nave (SPAZIO) e frena con W, meglio vicino al punto più basso, finché la Luna ti lega.', D_],
    ['  4  ORBITA       con spinte al punto più basso e al punto più alto fai combaciare la tua orbita con l\'anello verde e non spingere per 120 secondi di gioco: la nave viene agganciata.', D_],
    ['Due record per ogni orbita: tempo di missione più breve (i giorni di viaggio, non il tempo che passi a giocare) e minor propellente usato.', T_],
    ['', T_], ['COMANDI', O_],
    ...[['W', 'spinta del motore (nella direzione della prua)'], ['A / D   (o ← / →)', 'ruota la nave: la rotazione continua finché non la contrasti'], ['SPAZIO', 'flip: mezzo giro automatico'], ['Q', 'stabilizzatore: tiene la nave allineata al moto'],
        ['1 / 2', 'velocità del tempo: 600× / 10.000×  (+ / − per tararla)'], ['O', 'sceglie l\'orbita di attracco (o clic nel pannello)'], ['B', 'nasconde le barrette'], ['P', 'pausa'], ['N', 'suoni sì / no'], ['INVIO', 'ricomincia il tentativo'], ['H', 'questa guida']]
      .map(([k, d]) => ['  ' + k.padEnd(20) + d, T_]),
    ['', T_], ['I TUOI RECORD', O_], ...R.map(t => [t, D_]),
    ['', T_], ...(LOG_ON ? [['Test: raccoglie dati anonimi di gioco (nessun dato personale).', D_]] : LOCALE ? [['ANTEPRIMA LOCALE: i dati di gioco non vengono inviati.', COL.warn]] : []), ['versione ' + VERSION, D_],
    ['', T_], ['Premi INVIO (o clicca) per iniziare', O_, { center: true }],
  ], 'SPACE TRUCKER  -  Terra-Luna', N_, false);
}
